<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nachimbong OLED Studio V3.1</title>
    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@700&family=Russo+One&family=Bungee&family=Audiowide&display=swap');
        body { background: #000; color: #fff; touch-action: none; overflow-x: hidden; font-family: sans-serif; }
        .oled-border { border: 2px solid #ed1c24; box-shadow: 0 0 15px rgba(237,28,36,0.3); }
        canvas { display: block; image-rendering: pixelated; background-color: #0a0a0a; }
        input[type=range] { accent-color: #ed1c24; }
        .grid-bg {
            background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 8px 8px;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [tab, setTab] = useState("text");
            const [bleStatus, setBleStatus] = useState("Desconectado");
            const [status, setStatus] = useState("🎨 Diseña para tu OLED");

            // Refs
            const bleDev = useRef(null);
            const bleChr = useRef(null);
            const gridCanvasRef = useRef(null);
            const textCanvasRef = useRef(null);
            const pixels = useRef(new Uint8Array(128 * 128));
            const isDrawing = useRef(false);

            // State
            const [zoom, setZoom] = useState(2);
            const [brushSize, setBrushSize] = useState(2);
            const [tool, setTool] = useState("pen");
            const [texts, setTexts] = useState(["STRAY KIDS", "STAY", ""]);
            const [numLines, setNumLines] = useState(1);
            const [font, setFont] = useState("Russo One");
            const [fontSize, setFontSize] = useState(24);

            // --- REINTENTO DE CONEXIÓN ---
            const connect = async () => {
                try {
                    setBleStatus("Buscando...");
                    const dev = await navigator.bluetooth.requestDevice({
                        filters: [{ namePrefix: "STRAY KIDS" }],
                        optionalServices: ["0000fff0-0000-1000-8000-00805f9b34fb"]
                    });
                    bleDev.current = dev;
                    const server = await dev.gatt.connect();
                    const service = await server.getPrimaryService("0000fff0-0000-1000-8000-00805f9b34fb");
                    bleChr.current = await service.getCharacteristic("0000fff1-0000-1000-8000-00805f9b34fb");
                    setBleStatus("Conectado ✅");
                    setStatus("Nachimbong conectado!");
                } catch (e) {
                    setBleStatus("Error");
                    setStatus("Error BLE: " + e.message);
                }
            };

            // --- LÓGICA DE DIBUJO ---
            const refreshGrid = () => {
                const canvas = gridCanvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = "#000";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#fff";
                for (let i = 0; i < 128 * 128; i++) {
                    if (pixels.current[i]) {
                        const r = Math.floor(i / 128);
                        const c = i % 128;
                        ctx.fillRect(c * zoom, r * zoom, zoom, zoom);
                    }
                }
            };

            useEffect(() => { if (tab === "draw") setTimeout(refreshGrid, 50); }, [tab, zoom]);

            const handlePaint = (e) => {
                if (!isDrawing.current || !gridCanvasRef.current) return;
                const canvas = gridCanvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                const col = Math.floor((clientX - rect.left) / (rect.width / 128));
                const row = Math.floor((clientY - rect.top) / (rect.height / 128));

                if (col >= 0 && col < 128 && row >= 0 && row < 128) {
                    const ctx = canvas.getContext('2d');
                    const val = tool === "pen" ? 1 : 0;
                    const radius = Math.floor(brushSize / 2);

                    for (let dr = -radius; dr <= radius; dr++) {
                        for (let dc = -radius; dc <= radius; dc++) {
                            const r = row + dr, c = col + dc;
                            if (r >= 0 && r < 128 && c >= 0 && c < 128) {
                                pixels.current[r * 128 + c] = val;
                                ctx.fillStyle = val ? "white" : "black";
                                ctx.fillRect(c * zoom, r * zoom, zoom, zoom);
                            }
                        }
                    }
                }
            };

            // --- TEXTO ---
            useEffect(() => {
                if (tab === "text" && textCanvasRef.current) {
                    const ctx = textCanvasRef.current.getContext('2d');
                    ctx.fillStyle = "black"; ctx.fillRect(0,0,128,128);
                    ctx.fillStyle = "white"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    ctx.font = `bold ${fontSize}px ${font}`;
                    const active = texts.slice(0, numLines);
                    const startY = 64 - ((active.length - 1) * (fontSize * 1.1)) / 2;
                    active.forEach((t, i) => {
                        ctx.fillText(t.toUpperCase(), 64, startY + i * (fontSize * 1.1));
                    });
                }
            }, [tab, texts, numLines, font, fontSize]);

            // --- ENVIAR ---
            const send = async () => {
                let data = new Uint8Array(2048);
                if (tab === "text") {
                    const img = textCanvasRef.current.getContext('2d').getImageData(0,0,128,128).data;
                    for (let p=0; p<16; p++) {
                        for (let c=0; c<128; c++) {
                            let b = 0;
                            for (let bit=0; bit<8; bit++) if (img[((p*8+bit)*128+c)*4] > 128) b |= (1 << bit);
                            data[p*128+c] = b;
                        }
                    }
                } else {
                    for (let p=0; p<16; p++) {
                        for (let c=0; c<128; c++) {
                            let b = 0;
                            for (let bit=0; bit<8; bit++) if (pixels.current[(p*8+bit)*128+c]) b |= (1 << bit);
                            data[p*128+c] = b;
                        }
                    }
                }

                if (!bleChr.current) return setStatus("⚠️ Conecta el Bluetooth primero");
                setStatus("📡 Enviando...");
                try {
                    for (let i = 0; i < data.length; i += 20) {
                        await bleChr.current.writeValue(new Uint8Array(data.slice(i, i + 20)));
                    }
                    setStatus("✅ Diseño enviado!");
                } catch (e) {
                    setStatus("❌ Error envío");
                }
            };

            return (
                <div className="flex flex-col items-center min-h-screen p-4 max-w-lg mx-auto">
                    <button onClick={connect} className="w-full mb-4 bg-gray-900 border border-red-900 p-3 rounded-2xl flex justify-between items-center active:scale-95 transition-all">
                        <span className="text-[10px] font-black text-red-500 uppercase tracking-widest">{bleStatus}</span>
                        <span className="bg-red-600 px-3 py-1 rounded-lg text-[10px] font-bold">CONECTAR</span>
                    </button>

                    <nav className="flex w-full gap-1 mb-6 bg-gray-900 p-1 rounded-2xl border border-gray-800">
                        <button onClick={() => setTab("text")} className={`flex-1 py-3 text-[10px] font-black rounded-xl ${tab==="text"?"bg-black text-red-600":"text-gray-500"}`}>MENSAJE</button>
                        <button onClick={() => setTab("draw")} className={`flex-1 py-3 text-[10px] font-black rounded-xl ${tab==="draw"?"bg-black text-red-600":"text-gray-500"}`}>DIBUJO</button>
                    </nav>

                    <div className="oled-border bg-black rounded-lg overflow-hidden mb-6 relative" style={{width: 256, height: 256}}>
                        {tab === "text" ? (
                            <canvas ref={textCanvasRef} width="128" height="128" style={{width:256, height:256}} />
                        ) : (
                            <canvas 
                                ref={gridCanvasRef} 
                                width={128*zoom} height={128*zoom} 
                                onMouseDown={() => isDrawing.current = true}
                                onMouseMove={handlePaint}
                                onMouseUp={() => isDrawing.current = false}
                                onTouchStart={() => isDrawing.current = true}
                                onTouchMove={handlePaint}
                                onTouchEnd={() => isDrawing.current = false}
                                style={{width: 256, height: 256}}
                                className="cursor-crosshair"
                            />
                        )}
                        <div className="absolute inset-0 grid-bg pointer-events-none opacity-20"></div>
                    </div>

                    {tab === "draw" && (
                        <div className="w-full bg-gray-900 p-4 rounded-3xl border border-gray-800 mb-6 flex justify-between items-center gap-3">
                            <div className="flex gap-2">
                                <button onClick={() => setTool("pen")} className={`w-10 h-10 rounded-xl border flex items-center justify-center text-lg ${tool==="pen"?"bg-red-600 border-red-600":"border-gray-700 bg-black"}`}>✏️</button>
                                <button onClick={() => setTool("eraser")} className={`w-10 h-10 rounded-xl border flex items-center justify-center text-lg ${tool==="eraser"?"bg-red-600 border-red-600":"border-gray-700 bg-black"}`}>🧹</button>
                            </div>
                            <div className="flex-1 space-y-1">
                                <div className="flex justify-between text-[8px] text-gray-500 font-bold"><span>PINCEL</span><span>{brushSize}PX</span></div>
                                <input type="range" min="1" max="12" value={brushSize} onChange={e => setBrushSize(+e.target.value)} className="w-full h-1" />
                            </div>
                            <button onClick={() => {pixels.current.fill(0); refreshGrid();}} className="text-[8px] font-black border border-red-900 text-red-500 px-3 py-2 rounded-lg">LIMPIAR</button>
                        </div>
                    )}

                    {tab === "text" && (
                        <div className="w-full bg-gray-900 p-4 rounded-3xl border border-gray-800 mb-6 space-y-3">
                            <input value={texts[0]} onChange={e => setTexts([e.target.value, texts[1]])} className="w-full bg-black border border-gray-800 rounded-xl px-4 py-2 text-sm focus:border-red-600 outline-none" placeholder="Texto..." />
                            <div className="flex gap-2 text-[10px]">
                                {["Russo One", "Orbitron", "Bungee", "VT323"].map(f => (
                                    <button key={f} onClick={() => setFont(f)} className={`flex-1 py-2 border rounded-lg ${font===f?"border-red-600 text-red-500":"border-gray-800"}`} style={{fontFamily:f}}>{f}</button>
                                ))}
                            </div>
                        </div>
                    )}

                    <button onClick={send} className="w-full bg-red-600 text-white font-black py-4 rounded-3xl shadow-xl shadow-red-900/30 active:scale-95 transition-all text-xs tracking-widest">
                        📡 ENVIAR AL NACHIMBONG
                    </button>
                    <p className="mt-4 text-[9px] font-mono text-gray-500 uppercase tracking-widest animate-pulse">{status}</p>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
