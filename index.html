<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nachimbong OLED Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            background: #0a0a0a;
            color: #eee;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        h2 { color: #ed1c24; font-size: 1.2rem; }

        #canvas {
            border: 2px solid #ed1c24;
            background: #000;
            width: 240px;
            height: 240px;
            image-rendering: pixelated;
            touch-action: none;
            border-radius: 5px;
        }

        /* --- EDITOR DE TEXTO --- */
        .text-panel {
            background: #111;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .text-panel label { font-size: 0.7rem; color: #666; text-align: left; text-transform: uppercase; letter-spacing: 1px; }
        .text-panel input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            border-radius: 20px;
            border: 1px solid #444;
            background: #000;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        .text-panel input[type="text"]:focus { border-color: #ed1c24; }
        .font-row { display: flex; gap: 6px; flex-wrap: wrap; }
        .font-btn {
            flex: 1;
            min-width: 60px;
            padding: 8px 4px;
            border-radius: 10px;
            border: 1px solid #444;
            background: #000;
            color: white;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .font-btn.active { border-color: #ed1c24; color: #ed1c24; }
        .size-row { display: flex; align-items: center; gap: 8px; }
        .size-row input[type="range"] { flex: 1; accent-color: #ed1c24; }
        .size-row span { font-size: 0.8rem; color: #888; min-width: 30px; }
        #applyTextBtn {
            padding: 10px;
            border-radius: 20px;
            border: none;
            background: #ed1c24;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
        }

        /* --- GALERÍA --- */
        .gallery {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 7px;
            width: 100%;
            max-width: 320px;
            background: #111;
            padding: 10px;
            border-radius: 12px;
        }
        .gallery-item {
            aspect-ratio: 1;
            background: #000;
            border: 1px solid #444;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            color: white;
            transition: transform 0.1s;
        }
        .gallery-item:active { transform: scale(0.9); border-color: #ed1c24; }

        /* --- BOTONES --- */
        .controls { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 320px; }
        .btn-row { display: flex; gap: 8px; }
        button.main-btn {
            flex: 1;
            padding: 14px;
            font-weight: bold;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
        }
        #sendBtn { background: #ed1c24; color: white; }
        #clearBtn { background: #222; color: #aaa; border: 1px solid #333; }
        #reconnectBtn { background: #000; color: #1e90ff; border: 1px solid #1e90ff; }
        #resetDevBtn { background: #000; color: #ff9900; border: 1px solid #ff9900; }

        #status { color: #888; font-size: 0.8em; min-height: 20px; }
    </style>
</head>
<body>

    <h2>OLED Studio</h2>

    <canvas id="canvas" width="128" height="128"></canvas>

    <!-- EDITOR DE TEXTO -->
    <div class="text-panel">
        <label>✏️ Agregar Texto</label>
        <input type="text" id="textInput" placeholder="Escribe aquí..." maxlength="20">
        <label>Fuente:</label>
        <div class="font-row">
            <button class="font-btn active" data-font="Arial" onclick="selectFont(this)">Normal</button>
            <button class="font-btn" data-font="serif" onclick="selectFont(this)">Serif</button>
            <button class="font-btn" data-font="monospace" onclick="selectFont(this)">Mono</button>
            <button class="font-btn" data-font="fantasy" onclick="selectFont(this)">Fantasy</button>
        </div>
        <label>Tamaño: <span id="sizeVal">24</span>px</label>
        <div class="size-row">
            <input type="range" id="fontSize" min="8" max="60" value="24" oninput="document.getElementById('sizeVal').innerText=this.value">
        </div>
        <button id="applyTextBtn" onclick="applyText()">APLICAR TEXTO AL CANVAS</button>
    </div>

    <!-- GALERÍA DE ICONOS -->
    <div class="gallery">
        <div class="gallery-item" onclick="loadIcon('❤️')">❤️</div>
        <div class="gallery-item" onclick="loadIcon('⭐')">⭐</div>
        <div class="gallery-item" onclick="loadIcon('⚡')">⚡</div>
        <div class="gallery-item" onclick="loadIcon('🔥')">🔥</div>
        <div class="gallery-item" onclick="loadIcon('👑')">👑</div>
        <div class="gallery-item" onclick="loadIcon('🐺')">🐺</div>
        <div class="gallery-item" onclick="loadIcon('🌙')">🌙</div>
        <div class="gallery-item" onclick="loadIcon('✨')">✨</div>
        <div class="gallery-item" onclick="loadIcon('🎵')">🎵</div>
        <div class="gallery-item" onclick="loadIcon('💎')">💎</div>
    </div>

    <!-- CONTROLES -->
    <div class="controls">
        <div class="btn-row">
            <button class="main-btn" id="clearBtn" onclick="clearCanvas()">🧹 LIMPIAR</button>
            <button class="main-btn" id="sendBtn" onclick="transferOled()">📡 ENVIAR</button>
        </div>
        <div class="btn-row">
            <button class="main-btn" id="reconnectBtn" onclick="initBT()">🔄 RECONECTAR BT</button>
            <button class="main-btn" id="resetDevBtn" onclick="resetDevice()">🔁 REINICIAR DISP.</button>
        </div>
        <div id="status">Iniciando...</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const status = document.getElementById('status');
        let isDrawing = false;
        let selectedFont = "Arial";

        // --- BLUETOOTH ---
        function initBT() {
            status.innerText = "Conectando Nachimbong...";
            try {
                if (window.bridge) {
                    window.bridge.blePairingStart("");
                    status.innerText = "Emparejando...";
                } else if (window.webkit?.messageHandlers?.blePairingStart) {
                    window.webkit.messageHandlers.blePairingStart.postMessage("");
                    status.innerText = "Emparejando (iOS)...";
                } else {
                    status.innerText = "Bridge no disponible.";
                }
            } catch(e) {
                status.innerText = "Error BT: " + e.message;
            }
        }

        // Reiniciar SOLO el dispositivo Nachimbong (sin recargar la página)
        function resetDevice() {
            status.innerText = "Reiniciando Nachimbong...";
            try {
                // Comando de reinicio del dispositivo (no de la página)
                const resetCmd = "8110,-";
                if (window.bridge) {
                    window.bridge.bleSendCmdList(resetCmd);
                    setTimeout(() => {
                        window.bridge.bleDisconnect("");
                        setTimeout(initBT, 2000); // Reconectar tras 2s
                    }, 500);
                } else if (window.webkit?.messageHandlers?.bleSendCmdList) {
                    window.webkit.messageHandlers.bleSendCmdList.postMessage(resetCmd);
                    setTimeout(() => {
                        window.webkit.messageHandlers.bleDisconnect?.postMessage("");
                        setTimeout(initBT, 2000);
                    }, 500);
                }
                status.innerText = "Reiniciando... reconectando en 2s";
            } catch(e) {
                status.innerText = "Error al reiniciar: " + e.message;
            }
        }

        // --- DIBUJO ---
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: (clientX - rect.left) * (128 / rect.width), y: (clientY - rect.top) * (128 / rect.height) };
        }
        canvas.addEventListener('pointerdown', (e) => { isDrawing = true; draw(e); });
        window.addEventListener('pointerup', () => { if (isDrawing) { isDrawing = false; saveCanvas(); } });
        canvas.addEventListener('pointermove', draw);

        function draw(e) {
            if (!isDrawing) return;
            ctx.fillStyle = "white";
            const pos = getPos(e);
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        function clearCanvas() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, 128, 128);
            saveCanvas();
            status.innerText = "Lienzo limpiado.";
        }
        function saveCanvas() { localStorage.setItem('last_oled_img', canvas.toDataURL()); }

        // --- EDITOR DE TEXTO ---
        function selectFont(btn) {
            document.querySelectorAll('.font-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedFont = btn.dataset.font;
        }

        function applyText() {
            const text = document.getElementById('textInput').value.trim();
            if (!text) { status.innerText = "⚠️ Escribe algo primero."; return; }
            const size = parseInt(document.getElementById('fontSize').value);
            ctx.fillStyle = "white";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.font = `bold ${size}px ${selectedFont}`;
            ctx.fillText(text, 64, 64);
            saveCanvas();
            status.innerText = `Texto "${text}" aplicado.`;
        }

        // --- GALERÍA DE ICONOS ---
        function loadIcon(emoji) {
            clearCanvas();
            ctx.fillStyle = "white";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.font = "90px Arial";
            ctx.fillText(emoji, 64, 68);
            saveCanvas();
            status.innerText = "Icono cargado.";
        }

        // --- ENVÍO AL NACHIMBONG ---
        async function transferOled() {
            status.innerText = "Preparando...";
            const imgData = ctx.getImageData(0, 0, 128, 128).data;
            let oledBytes = new Uint8Array(2048);

            for (let y = 0; y < 128; y++) {
                for (let x = 0; x < 128; x++) {
                    const idx = (y * 128 + x) * 4;
                    if (imgData[idx] > 128) {
                        const byteIdx = (Math.floor(y / 8) * 128) + x;
                        oledBytes[byteIdx] |= (1 << (y % 8));
                    }
                }
            }

            for (let part = 0; part < 16; part++) {
                const chunk = oledBytes.slice(part * 128, (part + 1) * 128);
                const hexData = Array.from(chunk).map(b => b.toString(16).padStart(2, '0')).join('');
                const cmd = `810F00000000${part.toString(16).padStart(2, '0')}${hexData},-`;

                try {
                    if (window.bridge) window.bridge.bleSendCmdList(cmd);
                    else if (window.webkit?.messageHandlers?.bleSendCmdList)
                        window.webkit.messageHandlers.bleSendCmdList.postMessage(cmd);
                    status.innerText = `Enviando: ${Math.round(((part+1)/16)*100)}%`;
                    await new Promise(r => setTimeout(r, 150));
                } catch(e) {
                    status.innerText = "⚠️ Error en parte " + (part+1);
                    return;
                }
            }
            status.innerText = "✅ ¡Enviado correctamente!";
        }

        window.onload = () => {
            const last = localStorage.getItem('last_oled_img');
            if (last) { let im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0); im.src = last; }
            setTimeout(initBT, 1000);
        };
    </script>
</body>
</html>
