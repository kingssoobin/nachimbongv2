<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nachimbong OLED Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Press+Start+2P&family=Dancing+Script:wght@700&family=Oswald:wght@700&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0a0a0a;
            color: #eee;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        h2 { color: #ed1c24; font-size: 1.2rem; letter-spacing: 2px; }

        #canvas {
            border: 2px solid #ed1c24;
            background: #000;
            width: 256px;
            height: 256px;
            image-rendering: pixelated;
            touch-action: none;
            border-radius: 5px;
            cursor: crosshair;
        }

        .panel {
            background: #111;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .panel-title {
            font-size: 0.65rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-bottom: 1px solid #222;
            padding-bottom: 6px;
            margin-bottom: 2px;
        }

        /* LÍNEAS */
        .lines-selector { display: flex; gap: 6px; }
        .line-btn {
            flex: 1;
            padding: 8px 4px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #000;
            color: #888;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.15s;
        }
        .line-btn.active { border-color: #ed1c24; color: #ed1c24; background: #1a0000; }

        .line-inputs { display: flex; flex-direction: column; gap: 6px; }
        .line-input-row { display: flex; align-items: center; gap: 6px; }
        .line-label { font-size: 0.7rem; color: #555; min-width: 18px; }
        .line-input-row input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid #333;
            background: #000;
            color: white;
            font-size: 0.9rem;
            outline: none;
        }
        .line-input-row input[type="text"]:focus { border-color: #ed1c24; }

        /* FUENTES */
        .font-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .font-btn {
            padding: 8px 4px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #000;
            color: #aaa;
            cursor: pointer;
            font-size: 0.72rem;
            text-align: center;
            transition: all 0.15s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .font-btn.active { border-color: #ed1c24; color: #ed1c24; background: #1a0000; }

        /* TAMAÑO */
        .size-row { display: flex; align-items: center; gap: 8px; }
        .size-row input[type="range"] { flex: 1; accent-color: #ed1c24; }
        .size-row span { font-size: 0.8rem; color: #888; min-width: 30px; text-align: right; }

        /* BOTÓN APLICAR */
        #applyTextBtn {
            padding: 11px;
            border-radius: 20px;
            border: none;
            background: #ed1c24;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
        #applyTextBtn:active { opacity: 0.8; }

        /* EMOJIS */
        .emoji-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
        .emoji-tab {
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid #333;
            background: #000;
            color: #888;
            cursor: pointer;
            font-size: 0.7rem;
        }
        .emoji-tab.active { border-color: #ed1c24; color: #ed1c24; }
        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
        }
        .emoji-item {
            aspect-ratio: 1;
            background: #000;
            border: 1px solid #222;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            transition: transform 0.1s;
        }
        .emoji-item:active { transform: scale(0.85); border-color: #ed1c24; }

        /* CONTROLES */
        .controls { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 320px; }
        .btn-row { display: flex; gap: 8px; }
        button.main-btn {
            flex: 1;
            padding: 13px;
            font-weight: bold;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
        }
        #sendBtn { background: #ed1c24; color: white; }
        #clearBtn { background: #1a1a1a; color: #aaa; border: 1px solid #333; }
        #reconnectBtn { background: #000; color: #1e90ff; border: 1px solid #1e90ff; }
        #resetDevBtn { background: #000; color: #ff9900; border: 1px solid #ff9900; }

        #status {
            color: #888;
            font-size: 0.78em;
            min-height: 20px;
            text-align: center;
            padding: 4px;
        }

        /* Ocultar líneas según selección */
        .line-row { transition: opacity 0.2s; }
        .line-row.hidden { opacity: 0.2; pointer-events: none; }
    </style>
</head>
<body>

<h2>⬛ OLED STUDIO</h2>

<canvas id="canvas" width="128" height="128"></canvas>

<!-- EDITOR DE TEXTO -->
<div class="panel">
    <div class="panel-title">✏️ Editor de Texto</div>

    <!-- Selector de líneas -->
    <div class="lines-selector">
        <button class="line-btn active" data-lines="1" onclick="setLines(1, this)">1 Línea</button>
        <button class="line-btn" data-lines="2" onclick="setLines(2, this)">2 Líneas</button>
        <button class="line-btn" data-lines="3" onclick="setLines(3, this)">3 Líneas</button>
    </div>

    <!-- Inputs de líneas -->
    <div class="line-inputs">
        <div class="line-input-row line-row" id="row1">
            <span class="line-label">L1</span>
            <input type="text" id="line1" placeholder="Línea 1..." maxlength="20">
        </div>
        <div class="line-input-row line-row hidden" id="row2">
            <span class="line-label">L2</span>
            <input type="text" id="line2" placeholder="Línea 2..." maxlength="20">
        </div>
        <div class="line-input-row line-row hidden" id="row3">
            <span class="line-label">L3</span>
            <input type="text" id="line3" placeholder="Línea 3..." maxlength="20">
        </div>
    </div>

    <!-- Fuentes -->
    <div class="panel-title" style="margin-top:4px;">Fuente</div>
    <div class="font-grid">
        <button class="font-btn active" data-font="Arial" onclick="selectFont(this)">Normal</button>
        <button class="font-btn" data-font="serif" onclick="selectFont(this)" style="font-family:serif;">Serif</button>
        <button class="font-btn" data-font="monospace" onclick="selectFont(this)" style="font-family:monospace;">Mono</button>
        <button class="font-btn" data-font="Pacifico" onclick="selectFont(this)" style="font-family:'Pacifico';">Pacifico</button>
        <button class="font-btn" data-font="'Press Start 2P'" onclick="selectFont(this)" style="font-family:'Press Start 2P';font-size:0.55rem;">Pixel</button>
        <button class="font-btn" data-font="'Dancing Script'" onclick="selectFont(this)" style="font-family:'Dancing Script';">Script</button>
        <button class="font-btn" data-font="Oswald" onclick="selectFont(this)" style="font-family:'Oswald';">Oswald</button>
        <button class="font-btn" data-font="'Permanent Marker'" onclick="selectFont(this)" style="font-family:'Permanent Marker';">Marker</button>
        <button class="font-btn" data-font="fantasy" onclick="selectFont(this)" style="font-family:fantasy;">Fantasy</button>
    </div>

    <!-- Tamaño -->
    <div class="panel-title" style="margin-top:4px;">Tamaño</div>
    <div class="size-row">
        <input type="range" id="fontSize" min="8" max="60" value="24"
            oninput="document.getElementById('sizeVal').innerText=this.value">
        <span id="sizeVal">24</span>px
    </div>

    <button id="applyTextBtn" onclick="applyText()">APLICAR AL CANVAS</button>
</div>

<!-- GALERÍA DE EMOJIS -->
<div class="panel">
    <div class="panel-title">😀 Emojis & Símbolos</div>
    <div class="emoji-tabs">
        <button class="emoji-tab active" onclick="showEmojiCat('fav', this)">⭐ Fav</button>
        <button class="emoji-tab" onclick="showEmojiCat('faces', this)">😀 Caras</button>
        <button class="emoji-tab" onclick="showEmojiCat('nature', this)">🌿 Nat</button>
        <button class="emoji-tab" onclick="showEmojiCat('objects', this)">💎 Obj</button>
        <button class="emoji-tab" onclick="showEmojiCat('symbols', this)">♥ Sim</button>
    </div>
    <div class="emoji-grid" id="emojiGrid"></div>
</div>

<!-- CONTROLES -->
<div class="controls">
    <div class="btn-row">
        <button class="main-btn" id="clearBtn" onclick="clearCanvas()">🧹 LIMPIAR</button>
        <button class="main-btn" id="sendBtn" onclick="transferOled()">📡 ENVIAR</button>
    </div>
    <div class="btn-row">
        <button class="main-btn" id="reconnectBtn" onclick="initBT()">🔄 RECONECTAR</button>
        <button class="main-btn" id="resetDevBtn" onclick="resetDevice()">🔁 REINICIAR</button>
    </div>
    <div id="status">Iniciando...</div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const statusEl = document.getElementById('status');
    let isDrawing = false;
    let selectedFont = "Arial";
    let numLines = 1;

    // ── EMOJIS ──────────────────────────────────────────────
    const emojiCats = {
        fav:     ['❤️','⭐','⚡','🔥','👑','🐺','🌙','✨','🎵','💎','🦋','🌸','💫','🎀','🏆','🌈'],
        faces:   ['😀','😍','🥰','😎','🤩','😭','😤','🥺','😂','🤣','😊','🙃','😏','🤔','😴','👻'],
        nature:  ['🌸','🌺','🌻','🌹','🍀','🌿','🌊','🌋','🌙','☀️','⛅','❄️','🌈','🦋','🐺','🦊'],
        objects: ['💎','🎵','🎶','🎸','🎹','🎤','🎧','🏆','🎯','🎲','🎮','📱','💻','🔮','⚔️','🛸'],
        symbols: ['❤️','🧡','💛','💚','💙','💜','🖤','🤍','♥','★','☆','♦','♣','♠','✦','✧']
    };
    let currentCat = 'fav';

    function showEmojiCat(cat, btn) {
        currentCat = cat;
        document.querySelectorAll('.emoji-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderEmojis();
    }

    function renderEmojis() {
        const grid = document.getElementById('emojiGrid');
        grid.innerHTML = '';
        emojiCats[currentCat].forEach(em => {
            const div = document.createElement('div');
            div.className = 'emoji-item';
            div.textContent = em;
            div.onclick = () => loadEmoji(em);
            grid.appendChild(div);
        });
    }

    function loadEmoji(emoji) {
        clearCanvas();
        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "90px Arial";
        ctx.fillText(emoji, 64, 68);
        saveCanvas();
        statusEl.innerText = "Emoji cargado: " + emoji;
    }

    // ── LÍNEAS ───────────────────────────────────────────────
    function setLines(n, btn) {
        numLines = n;
        document.querySelectorAll('.line-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('row1').classList.toggle('hidden', false);
        document.getElementById('row2').classList.toggle('hidden', n < 2);
        document.getElementById('row3').classList.toggle('hidden', n < 3);
        // Ajustar tamaño sugerido
        const sizeMap = { 1: 28, 2: 22, 3: 16 };
        document.getElementById('fontSize').value = sizeMap[n];
        document.getElementById('sizeVal').innerText = sizeMap[n];
    }

    // ── FUENTES ──────────────────────────────────────────────
    function selectFont(btn) {
        document.querySelectorAll('.font-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedFont = btn.dataset.font;
    }

    // ── TEXTO ────────────────────────────────────────────────
    function applyText() {
        const lines = [
            document.getElementById('line1').value.trim(),
            document.getElementById('line2').value.trim(),
            document.getElementById('line3').value.trim()
        ].slice(0, numLines).filter(l => l.length > 0);

        if (lines.length === 0) { statusEl.innerText = "⚠️ Escribe algo primero."; return; }

        const size = parseInt(document.getElementById('fontSize').value);
        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = `bold ${size}px ${selectedFont}`;

        const lineHeight = size * 1.25;
        const totalH = lineHeight * lines.length;
        const startY = (128 - totalH) / 2 + lineHeight / 2;

        lines.forEach((line, i) => {
            ctx.fillText(line, 64, startY + i * lineHeight);
        });

        saveCanvas();
        statusEl.innerText = `✅ ${lines.length} línea(s) aplicada(s).`;
    }

    // ── CANVAS ───────────────────────────────────────────────
    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: (clientX - rect.left) * (128 / rect.width),
            y: (clientY - rect.top) * (128 / rect.height)
        };
    }
    canvas.addEventListener('pointerdown', (e) => { isDrawing = true; draw(e); });
    window.addEventListener('pointerup', () => { if (isDrawing) { isDrawing = false; saveCanvas(); } });
    canvas.addEventListener('pointermove', draw);

    function draw(e) {
        if (!isDrawing) return;
        ctx.fillStyle = "white";
        const pos = getPos(e);
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, 3, 0, Math.PI * 2);
        ctx.fill();
    }

    function clearCanvas() {
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, 128, 128);
        saveCanvas();
    }
    function saveCanvas() { try { localStorage.setItem('last_oled_img', canvas.toDataURL()); } catch(e){} }

    // ── BLUETOOTH ────────────────────────────────────────────
    function initBT() {
        statusEl.innerText = "Conectando Nachimbong...";
        try {
            if (window.bridge) {
                window.bridge.blePairingStart("");
                statusEl.innerText = "Emparejando...";
            } else if (window.webkit?.messageHandlers?.blePairingStart) {
                window.webkit.messageHandlers.blePairingStart.postMessage("");
                statusEl.innerText = "Emparejando (iOS)...";
            } else {
                statusEl.innerText = "⚠️ Bridge no disponible (solo funciona en la app).";
            }
        } catch(e) { statusEl.innerText = "Error BT: " + e.message; }
    }

    function resetDevice() {
        statusEl.innerText = "Reiniciando Nachimbong...";
        try {
            const resetCmd = "8110,-";
            if (window.bridge) {
                window.bridge.bleSendCmdList(resetCmd);
                setTimeout(() => { window.bridge.bleDisconnect(""); setTimeout(initBT, 2000); }, 500);
            } else if (window.webkit?.messageHandlers?.bleSendCmdList) {
                window.webkit.messageHandlers.bleSendCmdList.postMessage(resetCmd);
                setTimeout(() => { window.webkit.messageHandlers.bleDisconnect?.postMessage(""); setTimeout(initBT, 2000); }, 500);
            }
            statusEl.innerText = "Reiniciando... reconectando en 2s";
        } catch(e) { statusEl.innerText = "Error al reiniciar: " + e.message; }
    }

    // ── ENVÍO AL NACHIMBONG (PROTOCOLO ORIGINAL) ─────────────
    async function transferOled() {
        statusEl.innerText = "Preparando imagen...";
        const imgData = ctx.getImageData(0, 0, 128, 128).data;
        let oledBytes = new Uint8Array(2048);

        for (let y = 0; y < 128; y++) {
            for (let x = 0; x < 128; x++) {
                const idx = (y * 128 + x) * 4;
                if (imgData[idx] > 128) {
                    const byteIdx = (Math.floor(y / 8) * 128) + x;
                    oledBytes[byteIdx] |= (1 << (y % 8));
                }
            }
        }

        for (let part = 0; part < 16; part++) {
            const chunk = oledBytes.slice(part * 128, (part + 1) * 128);
            const hexData = Array.from(chunk).map(b => b.toString(16).padStart(2, '0')).join('');
            const cmd = `810F00000000${part.toString(16).padStart(2, '0')}${hexData},-`;

            try {
                if (window.bridge) window.bridge.bleSendCmdList(cmd);
                else if (window.webkit?.messageHandlers?.bleSendCmdList)
                    window.webkit.messageHandlers.bleSendCmdList.postMessage(cmd);
                statusEl.innerText = `Enviando: ${Math.round(((part + 1) / 16) * 100)}%`;
                await new Promise(r => setTimeout(r, 150));
            } catch(e) {
                statusEl.innerText = "⚠️ Error en parte " + (part + 1);
                return;
            }
        }
        statusEl.innerText = "✅ ¡Enviado correctamente!";
    }

    // ── INIT ─────────────────────────────────────────────────
    window.onload = () => {
        renderEmojis();
        const last = localStorage.getItem('last_oled_img');
        if (last) {
            const im = new Image();
            im.onload = () => ctx.drawImage(im, 0, 0);
            im.src = last;
        } else {
            clearCanvas();
        }
        setTimeout(initBT, 1000);
    };
</script>
</body>
</html>
