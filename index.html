<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nachimbong OLED Studio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo">OLED<span>STUDIO</span></div>
    <div id="bridgeBadge" class="bridge-badge">Desconectado</div>
  </header>

  <main>
    <div class="canvas-card">
      <div class="canvas-header"><span>128x128px</span><span>MONOCHROME OLED</span></div>
      <div class="canvas-frame">
        <canvas id="canvas" width="128" height="128"></canvas>
      </div>
    </div>

    <div class="send-card">
      <button id="wolfBtn" class="btn-main glow">Wolfchan Mexa (Mostrar + Enviar)</button>
      <button id="bangchanBtn" class="btn-main" style="margin-top:10px">Bangchan AN01 (Animación + Enviar)</button>
      <div style="margin-top:12px">
        <button id="initBTBtn" class="btn-sec">🔄 Reconectar Bluetooth (bridge)</button>
      </div>
      <div id="status" class="console-log" style="margin-top:12px">Listo para conectar...</div>
    </div>
  </main>

  <footer>SKZ NACHIMBONG V2 • OLED STUDIO</footer>

  <script src="wolfchan_mexa.js"></script>
  <script src="bangchan_an01.js"></script>
  <script src="conect.js"></script>
  <script src="app.js"></script>
</body>
</html>
