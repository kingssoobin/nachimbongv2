
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nachimbong OLED Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
    <div class="logo">OLED<span>STUDIO</span></div>
    <div id="bridgeBadge" class="bridge-badge">Desconectado</div>
</header>

<main>
    <div class="canvas-card">
        <div class="canvas-header">
            <span>128x128px</span>
            <span>MONOCHROME OLED</span>
        </div>
        <div class="canvas-frame">
            <canvas id="canvas" width="128" height="128"></canvas>
        </div>
        <div class="toolbar">
            <button class="tool" onclick="clearCanvas()" title="Limpiar">🧹</button>
            <button class="tool" onclick="resetDevice()" title="Reiniciar">🔁</button>
        </div>
    </div>

    <!-- Barra de pestañas -->
    <div class="tab-bar">
        <button class="tab-item active" data-tab="texto" onclick="switchTab('texto', this)">ESCRIBIR<br>TEXTO</button>
        <button class="tab-item" data-tab="emojis" onclick="switchTab('emojis', this)">SELECTOR<br>DE EMOJIS</button>
        <button class="tab-item" data-tab="mexa" onclick="switchTab('mexa', this)">ANIMACIÓN<br>MEXA</button>
        <button class="tab-item" data-tab="an01" onclick="switchTab('an01', this)">ANIMACIÓN<br>CON MARACAS</button>
    </div>

    <!-- Pestaña: ESCRIBIR TEXTO -->
    <div class="card tab-panel active" id="tab-texto">
        <h3>✏️ Editor de Texto</h3>
        <div class="input-group">
            <button class="btn-sec line-btn active" onclick="setLines(1, this)">1L</button>
            <button class="btn-sec line-btn" onclick="setLines(2, this)">2L</button>
            <button class="btn-sec line-btn" onclick="setLines(3, this)">3L</button>
        </div>

        <div class="line-inputs" style="margin-bottom: 15px;">
            <input type="text" id="line1" placeholder="Línea 1..." maxlength="20" style="margin-bottom:5px">
            <input type="text" id="line2" placeholder="Línea 2..." maxlength="20" class="hidden" style="margin-bottom:5px">
            <input type="text" id="line3" placeholder="Línea 3..." maxlength="20" class="hidden">
        </div>

        <h3>Fuente</h3>
        <div class="font-grid">
            <button class="font-btn active" data-font="Arial" onclick="selectFont(this)">Arial</button>
            <button class="font-btn" data-font="serif" onclick="selectFont(this)">Serif</button>
            <button class="font-btn" data-font="'Press Start 2P'" onclick="selectFont(this)">Pixel</button>
            <button class="font-btn" data-font="'Pacifico'" onclick="selectFont(this)">Pacifico</button>
        </div>

        <div class="size-row" style="margin-top:15px">
            <input type="range" id="fontSize" min="8" max="60" value="24" oninput="document.getElementById('sizeVal').innerText=this.value">
            <span id="sizeVal">24</span>px
        </div>

        <button class="btn-main" onclick="applyText()" style="margin-top:15px">Aplicar Texto</button>
    </div>

    <!-- Pestaña: SELECTOR DE EMOJIS -->
    <div class="card tab-panel" id="tab-emojis">
        <h3>😀 Emojis</h3>
        <div class="input-group">
            <button class="btn-sec emoji-tab active" onclick="showEmojiCat('fav', this)">⭐</button>
            <button class="btn-sec emoji-tab" onclick="showEmojiCat('faces', this)">🙂</button>
            <button class="btn-sec emoji-tab" onclick="showEmojiCat('nature', this)">🌿</button>
        </div>
        <div class="emoji-grid" id="emojiGrid" style="margin-top:10px"></div>
    </div>

    <!-- Pestaña: ANIMACIÓN MEXA -->
    <div class="card tab-panel" id="tab-mexa">
        <h3>🐾 Animación Mexa</h3>
        <div class="font-grid">
          <button id="showWolfchanBtn" class="font-btn">Mostrar Wolf Chan Mexa</button>
          <button id="sendWolfchanBtn" class="font-btn">Enviar Wolf Chan Mexa</button>

          <button id="showPuppymBtn" class="font-btn">Mostrar PuppyM Mexa</button>
          <button id="sendPuppymBtn" class="font-btn">Enviar PuppyM Mexa</button>

          <button id="showBbokariBtn" class="font-btn">Mostrar BbokAri Mexa</button>
          <button id="sendBbokariBtn" class="font-btn">Enviar BbokAri Mexa</button>

          <button id="showQuokkaBtn" class="font-btn">Mostrar Quokka Mexa</button>
          <button id="sendQuokkaBtn" class="font-btn">Enviar Quokka Mexa</button>

          <button id="showFoxynyBtn" class="font-btn">Mostrar FoxI.NY Mexa</button>
          <button id="sendFoxynyBtn" class="font-btn">Enviar FoxI.NY Mexa</button>

          <button id="showDwaekkiBtn" class="font-btn">Mostrar Dwaekki Mexa</button>
          <button id="sendDwaekkiBtn" class="font-btn">Enviar Dwaekki Mexa</button>

          <button id="showLeebitBtn" class="font-btn">Mostrar Leebit Mexa</button>
          <button id="sendLeebitBtn" class="font-btn">Enviar Leebit Mexa</button>

          <button id="showJiniretBtn" class="font-btn">Mostrar Jiniret Mexa</button>
          <button id="sendJiniretBtn" class="font-btn">Enviar Jiniret Mexa</button>
        </div>
    </div>

    <!-- Pestaña: ANIMACIÓN AN01 -->
    <div class="card tab-panel" id="tab-an01">
        <h3>🎤 Animación con Maracas</h3>
        <div class="font-grid">
          <button id="showBangchanBtn" class="font-btn">Mostrar Wolf Chan con Maracas</button>
          <button id="sendBangchanBtn" class="font-btn">Enviar Wolf Chan con Maracas</button>

          <button id="showSeungminBtn" class="font-btn">Mostrar PuppyM con Maracas1</button>
          <button id="sendSeungminBtn" class="font-btn">Enviar PuppyM con Maracas</button>

          <button id="showFelixBtn" class="font-btn">Mostrar BbokAri con Maracas</button>
          <button id="sendFelixBtn" class="font-btn">Enviar BbokAri con Maracas</button>

          <button id="showInBtn" class="font-btn">Mostrar FoxI.NY con Maracas</button>
          <button id="sendInBtn" class="font-btn">Enviar FoxI.NY con Maracas</button>

          <button id="showHanBtn" class="font-btn">Mostrar Quokka con Maracas</button>
          <button id="sendHanBtn" class="font-btn">Enviar Quokka con Maracas</button>

          <button id="showLeeknowBtn" class="font-btn">Mostrar Leebit con Maracas</button>
          <button id="sendLeeknowBtn" class="font-btn">Enviar Leebit con Maracas</button>

          <button id="showChangbinBtn" class="font-btn">Mostrar Dwaekki con Maracas</button>
          <button id="sendChangbinBtn" class="font-btn">Enviar Dwaekki con Maracas</button>

          <button id="showHyunjinBtn" class="font-btn">Mostrar Jiniret con Maracas</button>
          <button id="sendHyunjinBtn" class="font-btn">Enviar Jiniret con Maracas</button>
        </div>
    </div>

    <!-- Controles globales (siempre visibles) -->
    <div class="send-card">
        <button id="sendBtn" class="btn-main glow">📡 Enviar al Nachimbong</button>
        <button id="reconnectBtn" class="btn-main" style="margin-top: 8px;">🔄 Reconectar Bluetooth</button>

        <div id="status" class="console-log" style="margin-top:15px">Listo para conectar...</div>
    </div>
</main>

<script>
    function switchTab(tab, el) {
        document.querySelectorAll('.tab-panel').forEach(function (p) {
            p.classList.remove('active');
        });
        document.querySelectorAll('.tab-item').forEach(function (t) {
            t.classList.remove('active');
        });
        var panel = document.getElementById('tab-' + tab);
        if (panel) panel.classList.add('active');
        if (el) el.classList.add('active');
    }
</script>

<footer>SKZ NACHIMBONG V2 • OLED STUDIO • KINGS_SOOBIN</footer>

<!-- diseños incorporados -->
<script src="wolfchan_mexa.js"></script>
<script src="bangchan_an01.js"></script>
<script src="puppym_mexa.js"></script>
<script src="bbokari_mexa.js"></script>
<script src="quokka_mexa.js"></script>
<script src="foxyny_mexa.js"></script>
<script src="dwaekki_mexa.js"></script>
<script src="leebit_mexa.js"></script>
<script src="jiniret_mexa.js"></script>
<script src="seungmin_an01.js"></script>
<script src="felix_an01.js"></script>
<script src="in_an01.js"></script>
<script src="han_an01.js"></script>
<script src="leeknow_an01.js"></script>
<script src="changbin_an01.js"></script>
<script src="hyunjin_an01.js"></script>
<!-- app logic -->
<script src="conect.js"></script>
<script src="app.js"></script>

</body>
</html>
