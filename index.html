<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nachimbong OLED Fix</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #111; color: #eee; }
        canvas { border: 2px solid #ed1c24; background: #000; touch-action: none; width: 256px; height: 256px; image-rendering: pixelated; }
        .controls { margin: 20px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        button { padding: 15px 30px; font-weight: bold; border-radius: 25px; border: none; cursor: pointer; }
        #sendBtn { background: #ed1c24; color: white; }
        #clearBtn { background: #444; color: white; }
        #status { color: #888; font-size: 0.9em; margin-top: 10px; }
    </style>
</head>
<body>

    <h3>Nachimbong OLED Studio</h3>
    
    <canvas id="canvas" width="128" height="128"></canvas>

    <div class="controls">
        <button id="sendBtn">ENVIAR AL NACHIMBONG</button>
        <button id="clearBtn">LIMPIAR</button>
        <div id="status">Esperando conexión técnica...</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        let isDrawing = false;

        // Recuperar imagen guardada al estilo "reinicio" original
        const savedImg = localStorage.getItem('last_oled_img');
        if (savedImg) {
            const img = new Image();
            img.onload = () => ctx.drawImage(img, 0, 0);
            img.src = savedImg;
        }

        // Dibujo básico
        canvas.addEventListener('pointerdown', () => isDrawing = true);
        window.addEventListener('pointerup', () => {
            isDrawing = false;
            localStorage.setItem('last_oled_img', canvas.toDataURL());
        });
        canvas.addEventListener('pointermove', draw);

        function draw(e) {
            if (!isDrawing) return;
            ctx.fillStyle = "white";
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (128 / rect.width);
            const y = (e.clientY - rect.top) * (128 / rect.height);
            ctx.beginPath();
            ctx.arc(x, y, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        document.getElementById('clearBtn').onclick = () => {
            ctx.clearRect(0, 0, 128, 128);
            localStorage.removeItem('last_oled_img');
        };

        // Lógica de envío "Original" detectada en el minificado
        async function transferOled() {
            status.innerText = "Preparando imagen...";
            
            // Convertir a 1-bit monochromo (SSD1306 Horizontal / Vertical Pack)
            // Para evitar los "16 mini corazones", recorremos de forma que rellene la pantalla completa
            const imgData = ctx.getImageData(0, 0, 128, 128).data;
            let oledBytes = new Uint8Array(2048); 
            
            for (let y = 0; y < 128; y++) {
                for (let x = 0; x < 128; x++) {
                    const idx = (y * 128 + x) * 4;
                    if (imgData[idx] > 128) { // Si el píxel es blanco
                        const byteIdx = (Math.floor(y / 8) * 128) + x;
                        oledBytes[byteIdx] |= (1 << (y % 8));
                    }
                }
            }

            // Enviar en bloques de 128 bytes (16 partes)
            // Comando original detectado: 810F...
            status.innerText = "Enviando... No cierres la app";

            for (let part = 0; part < 16; part++) {
                const chunk = oledBytes.slice(part * 128, (part + 1) * 128);
                const hexData = Array.from(chunk).map(b => b.toString(16).padStart(2, '0')).join('');
                
                // Formato de comando: 810F + totalImgs(4) + curImg(4) + part(2) + data + ,-
                const cmd = `810F00000000${part.toString(16).padStart(2, '0')}${hexData},-`;
                
                if (window.bridge) {
                    window.bridge.bleSendCmdList(cmd);
                } else if (window.webkit && window.webkit.messageHandlers) {
                    window.webkit.messageHandlers.bleSendCmdList.postMessage(cmd);
                }

                status.innerText = `Enviando parte ${part+1} de 16...`;
                // Delay para no saturar el bridge nativo
                await new Promise(r => setTimeout(r, 150));
            }

            status.innerText = "¡Listo! Reiniciando...";
            await new Promise(r => setTimeout(r, 1000));
            
            // Simular el reinicio de la app oficial
            if (window.bridge) window.bridge.bleDisconnect("");
            location.reload();
        }

        document.getElementById('sendBtn').onclick = transferOled;

        // Auto-conectar al cargar (como la app oficial)
        window.onload = () => {
            setTimeout(() => {
                if (window.bridge) window.bridge.blePairingStart("");
            }, 1000);
        };
    </script>
</body>
</html>
