<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nachimbong v2 - Editor</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="topbar">
    <div class="logo">Nachimbong <span>v2</span></div>
    <div id="bridgeStatus" class="bridge-badge">Bridge</div>
  </div>

  <main>
    <div class="canvas-card">
      <div class="canvas-header">
        <div>Preview</div>
        <div id="canvasInfo">64x32</div>
      </div>
      <div class="canvas-frame">
        <canvas id="canvas" width="256" height="128"></canvas>
      </div>
    </div>

    <div class="card">
      <h3>Editor</h3>
      <div class="input-group">
        <input id="inputText" type="text" placeholder="Texto (1L / 2L / 3L)" />
        <button id="applyTextBtn" class="btn-sec">Aplicar</button>
      </div>

      <div class="font-grid">
        <button class="font-btn" data-font="1">1L</button>
        <button class="font-btn" data-font="2">2L</button>
        <button class="font-btn" data-font="3">3L</button>
      </div>
    </div>

    <div class="send-card">
      <h3>Enviar</h3>
      <div class="toolbar">
        <button id="showWolfchanBtn" class="btn-sec">Mostrar Wolfchan Mexa</button>
        <button id="sendWolfchanBtn" class="btn-main sendBtn" data-design="wolfchan_mexa">Enviar Wolfchan Mexa</button>
        <button id="showBangchanBtn" class="btn-sec">Mostrar Bangchan AN01</button>
        <button id="sendBangchanBtn" class="btn-main sendBtn" data-design="bangchan_an01">Enviar Bangchan AN01</button>
      </div>

      <div style="margin-top:12px; display:flex; gap:8px;">
        <button id="sendBtn" class="btn-main sendBtn">Enviar al Nachimbong</button>
        <button id="resetBtn" class="btn-sec">🔁</button>
      </div>

      <div style="margin-top:12px;">
        <div id="status" class="console-log">Estado: listo</div>
      </div>
    </div>
  </main>

  <footer>
    Hecho con ❤️ — Nachimbong v2
  </footer>

  <!-- Scripts: mantener el orden: diseños -> conect -> parches -> app -->
  <script src="bangchan_an01.js"></script>
  <script src="wolfchan_mexa.js"></script>
  <script src="conect.js"></script>
  <script src="send-buttons-patch.js"></script>
  <script src="app.js"></script>
</body>
</html>
