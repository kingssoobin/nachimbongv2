
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nachimbong OLED Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
    <div class="logo">OLED<span>STUDIO</span></div>
    <div id="bridgeBadge" class="bridge-badge">Desconectado</div>
</header>

<main>
    <div class="canvas-card">
        <div class="canvas-header">
            <span>128x128px</span>
            <span>MONOCHROME OLED</span>
        </div>
        <div class="canvas-frame">
            <canvas id="canvas" width="128" height="128"></canvas>
        </div>
        <div class="toolbar">
            <button class="tool" onclick="clearCanvas()" title="Limpiar">🧹</button>
            <button class="tool" onclick="resetDevice()" title="Reiniciar">🔁</button>
        </div>
    </div>

    <div class="card">
        <h3>Emojis removed</h3>
 style="margin-top:10px"></div>
    </div>

    <div class="send-card">
        <div class="font-grid" style="margin-bottom: 12px;">
          <button id="showWolfchanBtn" class="font-btn">Mostrar Wolfchan Mexa</button>
          <button id="showBangchanBtn" class="font-btn">Mostrar Bangchan AN01</button>
          <button id="sendWolfchanBtn" class="font-btn">Enviar Wolfchan Mexa</button>
          <button id="sendBangchanBtn" class="font-btn">Enviar Bangchan AN01</button>
        </div>

        <button id="sendBtn" class="btn-main glow">📡 Enviar al Nachimbong</button>
        <button id="reconnectBtn" class="btn-main" style="margin-top: 8px;">🔄 Reconectar Bluetooth</button>

        <div id="status" class="console-log" style="margin-top:15px">Listo para conectar...</div>
    </div>
</main>

<footer>SKZ NACHIMBONG V2 • OLED STUDIO</footer>

<!-- diseño incorporado -->
<script src="wolfchan_mexa.js"></script>
<script src="bangchan_an01.js"></script>
<!-- app logic -->
<script src="conect.js"></script>
<script src="app.js"></script>
</body>
</html>
