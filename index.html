        .panel-title{ font-size:0.65rem; color:#555; text-transform:uppercase; letter-spacing:1.5px; border-bottom:1px solid #222; padding-bottom:6px; margin-bottom:2px;}
        .controls{ display:flex; flex-direction:column; gap:8px; width:100%; max-width:320px;}
        .btn-row{ display:flex; gap:8px;}
        button.main-btn{ flex:1; padding:13px; font-weight:bold; border-radius:25px; border:none; cursor:pointer; font-size:0.85rem;}
        #sendBtn{ background:#ed1c24; color:white;}
        #clearBtn{ background:#1a1a1a; color:#aaa; border:1px solid #333;}
        #sendWolfBtn{ background:#5c8a00; color:white; border-radius:20px; padding:10px; }
        #status{ color:#888; font-size:0.78em; min-height:20px; text-align:center; padding:4px;}
        .small { font-size:0.85rem; padding:8px; border-radius:8px; }
        textarea { width:100%; height:120px; border-radius:8px; background:#000; color:#ddd; border:1px solid #333; padding:8px; resize:vertical; }
        #framesRow { display:flex; gap:6px; overflow:auto; padding-top:6px; }
    </style>

<body>
<h2>⬛ OLED STUDIO — GIF → Nachimbong</h2>

<canvas id="canvas" width="128" height="128"></canvas>

<!-- Panel principal (texto / fuentes / emojis) -->
<div class="panel">
    <div class="panel-title">✏️ Editor básico</div>
    <div style="font-size:0.9rem;color:#ddd">Usa el canvas para dibujar o aplica texto/emojis como antes.</div>
</div>

<!-- Panel GIF -->
<div class="panel">
    <div class="panel-title">📽️ Cargar GIF & Convertir</div>
    <input id="gifFile" type="file" accept="image/gif" />
    <div style="display:flex;gap:8px;">
        <button id="btnParse" class="small" onclick="onParseGif()">Convertir GIF</button>
        <button id="btnExport" class="small" onclick="onExportJS()" disabled>Exportar JS</button>
        <button id="btnSendDesign" class="small" onclick="onSendDesign()" disabled>Enviar a dispositivo</button>
    </div>
    <div style="margin-top:6px;">
        <label style="font-size:0.85rem;color:#888">Nombre para el diseño:</label>
        <input id="designName" type="text" class="small" value="mi_gif" style="width:100%;margin-top:6px;" />
    </div>

    <div style="margin-top:8px;">
        <label style="font-size:0.85rem;color:#888">Vista previa de frames:</label>
        <div id="framesRow"></div>
    </div>

    <div style="margin-top:8px;">
        <label style="font-size:0.85rem;color:#888">JS generado (lista para pegar):</label>
        <textarea id="exportArea" readonly placeholder="Aquí aparecerá el snippet JS al exportar..."></textarea>
    </div>
</div>

<!-- CONTROLES -->
<div class="controls">
    <div class="btn-row">
        <button class="main-btn" id="clearBtn" onclick="clearCanvas()">🧹 LIMPIAR</button>
        <button class="main-btn" id="sendBtn" onclick="transferOled()">📡 ENVIAR CANVAS</button>
    </div>
    <div class="btn-row">
        <button class="main-btn" id="reconnectBtn" onclick="initBT()">🔄 RECONECTAR</button>
        <button class="main-btn" id="resetDevBtn" onclick="resetDevice()">🔁 REINICIAR</button>
    </div>
    <div style="width:100%; max-width:320px; margin-top:6px;">
        <button id="sendWolfBtn" class="main-btn" onclick="sendMyDesign('wolfchan_mexa')">🖼️ ENVIAR WOLFCHAN</button>
    </div>
    <div id="status">Iniciando...</div>
</div>

<!-- gifuct-js -->
<script src="https://unpkg.com/gifuct-js/dist/gifuct.min.js"></script>

/* ====== Helpers & canvas core ====== */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const statusEl = document.getElementById('status');
const exportArea = document.getElementById('exportArea');
let isDrawing = false;
let selectedFont = "Arial";

canvas.addEventListener('pointerdown', (e)=>{ isDrawing=true; draw(e); });
window.addEventListener('pointerup', ()=>{ if(isDrawing){ isDrawing=false; saveCanvas(); }});
canvas.addEventListener('pointermove', draw);
function draw(e){
    if(!isDrawing) return;
    ctx.fillStyle = "white";
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const x = (clientX - rect.left) * (128/rect.width);
    const y = (clientY - rect.top) * (128/rect.height);
    ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fill();
}
function clearCanvas(){ ctx.fillStyle="black"; ctx.fillRect(0,0,128,128); saveCanvas(); }
function saveCanvas(){ try{ localStorage.setItem('last_oled_img', canvas.toDataURL()); }catch(e){} }

/* --- BLE bridge helpers --- */
function initBT(){ statusEl.innerText="Conectando Nachimbong..."; try{ if(window.bridge){ window.bridge.blePairingStart(""); statusEl.innerText="Emparejando..."; } else if(window.webkit?.messageHandlers?.blePairingStart){ window.webkit.messageHandlers.blePairingStart.postMessage(""); statusEl.innerText="Emparejando (iOS)..."; } else { statusEl.innerText="⚠️ Bridge no disponible (solo en app)."; } }catch(e){ statusEl.innerText="Error BT: "+e.message; } }
function resetDevice(){ statusEl.innerText="Reiniciando Nachimbong..."; try{ const resetCmd="8110,-"; if(window.bridge){ window.bridge.bleSendCmdList(resetCmd); setTimeout(()=>{ window.bridge.bleDisconnect(""); setTimeout(initBT,2000); },500); } else if(window.webkit?.messageHandlers?.bleSendCmdList){ window.webkit.messageHandlers.bleSendCmdList.postMessage(resetCmd); setTimeout(()=>{ window.webkit.messageHandlers.bleDisconnect?.postMessage(""); setTimeout(initBT,2000); },500); } statusEl.innerText="Reiniciando... reconectando en 2s"; }catch(e){ statusEl.innerText="Error al reiniciar: "+e.message; } }

/* ====== Conversion core: Image/Frame -> 2048 bytes -> 16 hex parts ====== */
function frameImageDataToParts(imgData, w=128, h=128){
    const oled = new Uint8Array(2048);
    for(let y=0;y<h;y++){
        for(let x=0;x<w;x++){
            const idx = (y*w + x)*4;
            if(imgData[idx] > 128){
                const byteIdx = (Math.floor(y/8)*128) + x;
                oled[byteIdx] |= (1 << (y%8));
            }
        }
    }
    const parts = [];
    for(let p=0;p<16;p++){
        const slice = oled.slice(p*128, (p+1)*128);
        parts.push(Array.from(slice).map(b=>b.toString(16).padStart(2,'0')).join(''));
    }
    return parts;
}

/* ====== GIF parsing & conversion (gifuct-js) ====== */
async function onParseGif(){
    const input = document.getElementById('gifFile');
    if(!input.files || !input.files[0]) { statusEl.innerText = "Selecciona un archivo GIF primero."; return; }
    const file = input.files[0];
    statusEl.innerText = "Leyendo GIF...";
    try {
        const buf = await file.arrayBuffer();
        const gif = window.gifuct.parseGIF(buf);
        const frames = window.gifuct.decompressFrames(gif, true);
        if(!frames || frames.length === 0){ statusEl.innerText = "No se pudieron extraer frames del GIF."; return; }
        statusEl.innerText = `GIF con ${frames.length} frames — procesando...`;

        const designFrames = [];
        const framesRow = document.getElementById('framesRow');
        framesRow.innerHTML = '';

        const tmp = document.createElement('canvas');
        const tmpCtx = tmp.getContext('2d');
        tmp.width = frames[0].dims.width;
        tmp.height = frames[0].dims.height;

        const scaleCanvas = document.createElement('canvas');
        const scaleCtx = scaleCanvas.getContext('2d');
        scaleCanvas.width = 128; scaleCanvas.height = 128;

        for(let i=0;i<frames.length;i++){
            const f = frames[i];
            if(tmp.width !== f.dims.width || tmp.height !== f.dims.height){ tmp.width = f.dims.width; tmp.height = f.dims.height; }
            const imageData = new ImageData(new Uint8ClampedArray(f.patch), f.dims.width, f.dims.height);
            tmpCtx.putImageData(imageData, 0, 0);

            scaleCtx.fillStyle = "black"; scaleCtx.fillRect(0,0,128,128);
            const sx = f.dims.width, sy = f.dims.height;
            const scale = Math.min(128/sx, 128/sy);
            const dw = Math.round(sx*scale), dh = Math.round(sy*scale);
            const dx = Math.round((128 - dw)/2), dy = Math.round((128 - dh)/2);
            scaleCtx.drawImage(tmp, 0,0, sx, sy, dx, dy, dw, dh);

            const scaledImg = scaleCtx.getImageData(0,0,128,128).data;
            const parts = frameImageDataToParts(scaledImg, 128, 128);
            designFrames.push(parts);

            const thumb = document.createElement('canvas');
            thumb.width = 64; thumb.height = 64;
            const tctx = thumb.getContext('2d');
            tctx.drawImage(scaleCanvas, 0,0,64,64);
            thumb.style.border = "1px solid #333"; thumb.style.marginRight = "6px";
            framesRow.appendChild(thumb);

            await new Promise(r=>setTimeout(r,0));
        }

        const name = (document.getElementById('designName').value || 'mi_gif').replace(/[^\w\-]/g,'_');
        window.MIS_DISENOS = window.MIS_DISENOS || {};
        window.MIS_DISENOS[name] = designFrames;
        statusEl.innerText = `Conversión completa: ${designFrames.length} frames. Diseño guardado como "${name}".`;
        document.getElementById('btnExport').disabled = false;
        document.getElementById('btnSendDesign').disabled = false;

        ctx.clearRect(0,0,128,128);
        ctx.drawImage(scaleCanvas, 0,0);

        document.getElementById('exportArea')?.value && (document.getElementById('exportArea').value = generateExportSnippet(name, designFrames));
        document.getElementById('exportArea') && (document.getElementById('exportArea').value = generateExportSnippet(name, designFrames));
    } catch(err){
        console.error(err);
        statusEl.innerText = "Error al parsear GIF: " + (err.message || err);
    }
}

/* ====== Export snippet (JS ready to paste) ====== */
function generateExportSnippet(name, framesArray){
    const safeName = name.replace(/[^\w\-]/g,'_');
    const lines = [];
    lines.push("// Copia esto y pégalo en tu script principal (ej. app.js)");
    lines.push("window.MIS_DISENOS = window.MIS_DISENOS || {};");
    lines.push(`window.MIS_DISENOS['${safeName}'] = [`);
    for(const f of framesArray){
        lines.push("  [");
        for(const p of f){
            lines.push(`    "${p}",`);
        }
        lines.push("  ],");
    }
    lines.push("];");
    return lines.join("\n");
}
function onExportJS(){ const name = document.getElementById('designName').value || 'mi_gif'; const obj = window.MIS_DISENOS?.[name.replace(/[^\w\-]/g,'_')]; if(!obj){ statusEl.innerText = "No hay diseño para exportar."; return; } document.getElementById('exportArea').value = generateExportSnippet(name, obj); statusEl.innerText = "Snippet listo — cópialo y pégalo en tu JS."; }

/* ====== Envío usando sendMyDesign (compatible con bridge nativo) ====== */
async function sendMyDesign(name){
    const design = window.MIS_DISENOS?.[name];
    if(!design){ statusEl.innerText = `Diseño "${name}" no encontrado.`; return; }
    statusEl.innerText = `Enviando "${name}" (${design.length} frames)...`;

    const totalFrames = design.length;
    for(let f = 0; f < totalFrames; f++){
        const frame = design[f];
        for(let p = 0; p < 16; p++){
            const parteHex = frame[p] || "".padEnd(128*2, "0");
            const totalHex = totalFrames.toString(16).padStart(4,'0').toUpperCase();
            const frameHex = f.toString(16).padStart(4,'0').toUpperCase();
            const partHex = p.toString(16).padStart(2,'0').toUpperCase();
            const cmd = `810F${totalHex}${frameHex}${partHex}${parteHex},-`;
            try {
                if(window.bridge) window.bridge.bleSendCmdList(cmd);
                else if(window.webkit?.messageHandlers?.bleSendCmdList) window.webkit.messageHandlers.bleSendCmdList.postMessage(cmd);
                statusEl.innerText = `Enviando ${name}: frame ${f+1}/${totalFrames} parte ${p+1}/16`;
                await new Promise(r=>setTimeout(r,120));
            } catch(e){
                statusEl.innerText = `Error al enviar frame ${f} parte ${p}: ${e.message||e}`;
                return;
            }
        }
        await new Promise(r=>setTimeout(r,120));
    }

    try{
        const playCmd = "810E01,-";
        if(window.bridge) window.bridge.bleSendCmdList(playCmd);
        else if(window.webkit?.messageHandlers?.bleSendCmdList) window.webkit.messageHandlers.bleSendCmdList.postMessage(playCmd);
    }catch(e){}
    statusEl.innerText = `✅ "${name}" enviado (${totalFrames} frames).`;
}

function onSendDesign(){
    const name = (document.getElementById('designName').value || 'mi_gif').replace(/[^\w\-]/g,'_');
    sendMyDesign(name);
}

/* ====== canvas → enviar (imagen estática) ====== */
async function transferOled(){
    statusEl.innerText = "Preparando imagen...";
    const imgData = ctx.getImageData(0,0,128,128).data;
    let oledBytes = new Uint8Array(2048);
    for(let y=0;y<128;y++){
        for(let x=0;x<128;x++){
            const idx=(y*128+x)*4;
            if(imgData[idx]>128){
                const byteIdx = (Math.floor(y/8)*128) + x;
                oledBytes[byteIdx] |= (1<<(y%8));
            }
        }
    }
    for(let part=0; part<16; part++){
        const chunk = oledBytes.slice(part*128,(part+1)*128);
        const hexData = Array.from(chunk).map(b=>b.toString(16).padStart(2,'0')).join('');
        const cmd = `810F00000000${part.toString(16).padStart(2,'0')}${hexData},-`;
        try {
            if(window.bridge) window.bridge.bleSendCmdList(cmd);
            else if(window.webkit?.messageHandlers?.bleSendCmdList) window.webkit.messageHandlers.bleSendCmdList.postMessage(cmd);
            statusEl.innerText = `Enviando: ${Math.round(((part+1)/16)*100)}%`;
            await new Promise(r=>setTimeout(r,150));
        } catch(e){
            statusEl.innerText = "⚠️ Error en parte " + (part+1);
            return;
        }
    }
    try{ if(window.bridge) window.bridge.bleSendCmdList("810E01,-"); else if(window.webkit?.messageHandlers?.bleSendCmdList) window.webkit.messageHandlers.bleSendCmdList.postMessage("810E01,-"); }catch(e){}
    statusEl.innerText = "✅ ¡Enviado correctamente!";
}

/* ====== UI wiring + init ====== */
document.getElementById('gifFile').addEventListener('change', ()=>{ document.getElementById('btnExport').disabled=true; document.getElementById('btnSendDesign').disabled=true; document.getElementById('exportArea').value=''; document.getElementById('framesRow').innerHTML=''; });

window.onload = ()=>{
    const last = localStorage.getItem('last_oled_img');
    if(last){ const im = new Image(); im.onload = ()=> ctx.drawImage(im,0,0); im.src = last; } else { clearCanvas(); }
    setTimeout(initBT, 1000);
};
