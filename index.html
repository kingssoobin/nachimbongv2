<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Nachimbong OLED Studio</title>
<link rel="stylesheet" href="styles.css" />
<style>
  body { font-family: sans-serif; background: #000; color: #fff; margin:0; padding:0; overflow-x:hidden; }
  .topbar { background: #111; padding: 15px; text-align: center; border-bottom: 2px solid #333; position: sticky; top:0; z-index: 100; }
  .logo span { color: #0f0; }

  .canvas-container { display: flex; flex-direction: column; align-items: center; padding: 20px 10px; }
  #drawCanvas { background: #000; border: 4px solid #222; image-rendering: pixelated; touch-action: none; cursor: crosshair; }

  .controls { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; max-width: 400px; margin: 0 auto; }
  button { background: #333; color: #fff; border: none; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 14px; }
  button.primary { background: #007bff; }
  button.danger { background: #c62828; }
  button:active { filter: brightness(1.2); }

  .status-bar { background: #1a1a2e; padding: 15px; margin: 10px; border-radius: 8px; font-size: 13px; border-left: 4px solid #555; }
  .status-bar.connected { border-left-color: #0f0; }
  .status-bar.searching { border-left-color: #f57c00; animation: pulse 1.5s infinite; }

  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

  #log { font-family: monospace; font-size: 10px; color: #666; padding: 10px; height: 80px; overflow-y: auto; background: #050505; margin: 10px; border-radius: 4px; }

  .hidden { display: none; }
  .frame-preview { width: 64px; height: 32px; border: 1px solid #444; margin: 2px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">⚡ Nachimbong <span>OLED Studio</span></div>
</header>

<main>
  <div class="status-bar searching" id="bleStatus">
    En busca del Nachimbong V2...
  </div>

  <div class="canvas-container">
    <div style="font-size: 12px; margin-bottom: 5px; color: #888;">Pintar aquí (64x32)</div>
    <canvas id="drawCanvas"></canvas>
  </div>

  <div class="controls">
    <button id="clearBtn" class="danger">Limpiar todo</button>
    <button id="invertBtn">Invertir</button>
    <button id="undoBtn">Deshacer</button>
    <button id="sendBtn" class="primary">📤 Enviar al Lightstick</button>
  </div>

  <div id="log">Bienvenido. Buscando bridge nativo...</div>
</main>

<script>
/* Nachimbong OLED Studio - Lógica corregida para APK + Dibujo Directo */

const CONFIG = {
  W: 64, H: 32,
  ZOOM: 5,
  AES_KEY: '2174516473A1F5351004A13E6B716AB9',
  HANDSHAKE: 'ed3823c3d92e1b9d69000194db6c5244'
};

const state = {
  ctx: null,
  isDrawing: false,
  history: [],
  connected: false,
  useNative: false
};

const $ = id => document.getElementById(id);
const log = msg => { 
  const el = $('log');
  const line = document.createElement('div');
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  el.prepend(line);
  console.log(msg);
};

// 1. Detección e Inicio de búsqueda automática
function initNative() {
  state.useNative = !!(window.bridge && (window.bridge.blePairingStart || window.bridge.bleSendCmdList));
  if (state.useNative) {
    log("✅ Bridge nativo detectado.");
    $('bleStatus').textContent = "Iniciando emparejamiento automático...";
    // Disparar búsqueda automática igual que el JS original
    setTimeout(() => {
      try {
        if(window.bridge.blePairingStart) window.bridge.blePairingStart("");
        log("Llamada enviada: blePairingStart");
      } catch(e) { log("Error blePairingStart: " + e.message); }
    }, 1000);
  } else {
    log("⚠️ No se detectó bridge. Esta web debe abrirse dentro del APK.");
    $('bleStatus').textContent = "⚠️ Bridge no disponible";
    $('bleStatus').classList.remove('searching');
  }
}

// Global para recibir callbacks del APK (NativeInterface)
window.NativeInterface = {
  bleGetUpdateStatus: function(res) {
    log("Native ACK: " + JSON.stringify(res));
    if (res && res !== "") {
      $('bleStatus').textContent = "✅ Conectado y listo";
      $('bleStatus').className = "status-bar connected";
      state.connected = true;
    }
  }
};

// 2. Lógica del Canvas (Dibujo táctil)
function initCanvas() {
  const canvas = $('drawCanvas');
  canvas.width = CONFIG.W * CONFIG.ZOOM;
  canvas.height = CONFIG.H * CONFIG.ZOOM;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  state.ctx = ctx;

  const getPos = e => {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: Math.floor((clientX - rect.left) / CONFIG.ZOOM),
      y: Math.floor((clientY - rect.top) / CONFIG.ZOOM)
    };
  };

  const draw = e => {
    if (!state.isDrawing) return;
    const {x, y} = getPos(e);
    ctx.fillStyle = "white";
    ctx.fillRect(x * CONFIG.ZOOM, y * CONFIG.ZOOM, CONFIG.ZOOM, CONFIG.ZOOM);
  };

  canvas.addEventListener('touchstart', e => { e.preventDefault(); state.isDrawing = true; saveHistory(); draw(e); });
  canvas.addEventListener('touchmove', e => { e.preventDefault(); draw(e); });
  canvas.addEventListener('touchend', () => state.isDrawing = false);

  canvas.addEventListener('mousedown', () => { state.isDrawing = true; saveHistory(); });
  canvas.addEventListener('mousemove', draw);
  window.addEventListener('mouseup', () => state.isDrawing = false);
}

function saveHistory() {
  if (state.history.length > 20) state.history.shift();
  state.history.push(state.ctx.getImageData(0,0,state.ctx.canvas.width, state.ctx.canvas.height));
}

$('clearBtn').onclick = () => {
  state.ctx.fillStyle = "black";
  state.ctx.fillRect(0,0,state.ctx.canvas.width, state.ctx.canvas.height);
};

$('undoBtn').onclick = () => {
  if (state.history.length) state.ctx.putImageData(state.history.pop(), 0, 0);
};

$('invertBtn').onclick = () => {
  const imgData = state.ctx.getImageData(0,0,state.ctx.canvas.width, state.ctx.canvas.height);
  const data = imgData.data;
  for (let i=0; i<data.length; i+=4) {
    data[i] = 255 - data[i]; data[i+1] = 255 - data[i+1]; data[i+2] = 255 - data[i+2];
  }
  state.ctx.putImageData(imgData, 0, 0);
};

// 3. Conversión SSD1306 y Envío
function getOledBytes() {
  const pixels = state.ctx.getImageData(0,0,state.ctx.canvas.width, state.ctx.canvas.height).data;
  const bytes = new Uint8Array(256); // 64 * 32 / 8

  for (let y = 0; y < 32; y++) {
    for (let x = 0; x < 64; x++) {
      const idx = ((y * CONFIG.ZOOM) * (64 * CONFIG.ZOOM) + (x * CONFIG.ZOOM)) * 4;
      const isWhite = pixels[idx] > 128;
      if (isWhite) {
        const page = Math.floor(y / 8);
        const bit = y % 8;
        bytes[page * 64 + x] |= (1 << bit);
      }
    }
  }
  return bytes;
}

const bytesToHex = b => Array.from(b).map(x => x.toString(16).padStart(2, '0')).join('');

async function sendData() {
  if (!state.useNative) { alert("⚠️ Bridge nativo no disponible"); return; }

  try {
    log("Enviando Handshake...");
    window.bridge.bleSendCmdList(CONFIG.HANDSHAKE);

    // El protocolo requiere enviar frames en chunks. 
    // Basado en el original, cada frame se expande a 2048 bytes (16 chunks de 128 bytes hex)
    const oledBytes = getOledBytes();
    const rawHex = bytesToHex(oledBytes);
    const fullData = rawHex.padEnd(4096, '0'); // Padding para completar el flujo del APK

    log("Enviando dibujo...");
    for (let i = 0; i < 16; i++) {
      const chunk = fullData.substr(i * 256, 256);
      const tf = "0001"; // Total frames
      const fi = "0000"; // Frame index
      const pi = i.toString(16).padStart(2, '0');
      const packet = "810F" + tf + fi + pi + chunk;

      window.bridge.bleSendCmdList(packet);
      log(`Chunk ${i}/15 enviado`);
      await new Promise(r => setTimeout(r, 60));
    }

    log("✅ ¡Proceso completado!");
    $('bleStatus').textContent = "✅ Dibujo enviado con éxito";
  } catch (e) {
    log("Error de envío: " + e.message);
  }
}

$('sendBtn').onclick = sendData;

window.onload = () => {
  initCanvas();
  initNative();
};
</script>

</body>
</html>
