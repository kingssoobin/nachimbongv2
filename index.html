<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nachimbong OLED Studio Connect</title>
    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@700&family=Permanent+Marker&family=VT323&family=Creepster&family=Russo+One&family=Bangers&family=Bungee&family=Audiowide&display=swap');
        body { background: #000; color: #fff; touch-action: none; }
        .oled-border { border: 4px solid #ed1c24; box-shadow: 0 0 25px rgba(237,28,36,0.2); }
        .grid-preview { image-rendering: pixelated; width: 256px; height: 256px; }
        canvas { display: block; image-rendering: pixelated; }
        input[type=range] { accent-color: #ed1c24; }
        .tool-btn { @apply border border-gray-800 rounded-xl px-4 py-2 text-[10px] font-bold transition-all; }
        .tool-active { @apply bg-red-600 border-red-600 text-white; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const App = () => {
            const [tab, setTab] = useState("text");
            const [bleStatus, setBleStatus] = useState("Desconectado");
            const [status, setStatus] = useState("🎨 Diseña tu OLED");

            // Bluetooth Refs
            const bleDev = useRef(null);
            const bleChr = useRef(null);
            const svcUuid = "0000fff0-0000-1000-8000-00805f9b34fb";
            const chrUuid = "0000fff1-0000-1000-8000-00805f9b34fb";

            // Drawing Refs
            const gridCanvasRef = useRef(null);
            const pixels = useRef(new Uint8Array(128 * 128));
            const [zoom, setZoom] = useState(4);
            const [brushSize, setBrushSize] = useState(1);
            const [tool, setTool] = useState("pen");
            const isDrawing = useRef(false);

            // Text State
            const textCanvasRef = useRef(null);
            const [numLines, setNumLines] = useState(1);
            const [texts, setTexts] = useState(["STRAY KIDS", "STAY", ""]);
            const [font, setFont] = useState("Russo One");
            const [fontSize, setFontSize] = useState(24);
            const [isCracked, setIsCracked] = useState(false);

            // ── BLUETOOTH ───────────────────────────────────────────
            const connect = async () => {
                try {
                    setBleStatus("Buscando...");
                    const dev = await navigator.bluetooth.requestDevice({
                        filters: [{ namePrefix: "STRAY KIDS" }],
                        optionalServices: [svcUuid]
                    });
                    bleDev.current = dev;
                    setBleStatus("Conectando...");
                    const server = await dev.gatt.connect();
                    const service = await server.getPrimaryService(svcUuid);
                    bleChr.current = await service.getCharacteristic(chrUuid);
                    setBleStatus("Conectado ✅");
                } catch (e) {
                    setBleStatus("Error");
                    console.error(e);
                }
            };

            const sendData = async (byteData) => {
                if (!bleChr.current) {
                    setStatus("⚠️ Conecta el Nachimbong primero");
                    return;
                }
                setStatus("📡 Enviando bits...");
                try {
                    // El protocolo suele requerir trozos de 20 bytes
                    for (let i = 0; i < byteData.length; i += 20) {
                        const chunk = new Uint8Array(byteData.slice(i, i + 20));
                        await bleChr.current.writeValue(chunk);
                    }
                    setStatus("✅ Transferencia completa");
                } catch (e) {
                    setStatus("❌ Error de envío");
                }
            };

            // ── DRAWING LOGIC ───────────────────────────────────────
            const drawPixel = (e) => {
                if (!isDrawing.current) return;
                const canvas = gridCanvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const x = Math.floor((e.clientX - rect.left) / zoom);
                const y = Math.floor((e.clientY - rect.top) / zoom);
                if (x < 0 || x >= 128 || y < 0 || y >= 128) return;

                const ctx = canvas.getContext('2d');
                const val = tool === "eraser" ? 0 : 1;
                const radius = Math.floor(brushSize / 2);

                for (let dr = -radius; dr <= radius; dr++) {
                    for (let dc = -radius; dc <= radius; dc++) {
                        const r = y + dr, c = x + dc;
                        if (r >= 0 && r < 128 && c >= 0 && c < 128) {
                            pixels.current[r * 128 + c] = val;
                            ctx.fillStyle = val ? "white" : "black";
                            ctx.fillRect(c * zoom, r * zoom, zoom, zoom);
                        }
                    }
                }
            };

            const clearGrid = () => {
                pixels.current.fill(0);
                const ctx = gridCanvasRef.current.getContext('2d');
                ctx.fillStyle = "black";
                ctx.fillRect(0,0, 128*zoom, 128*zoom);
            };

            useEffect(() => {
                if (tab === "draw" && gridCanvasRef.current) {
                    const ctx = gridCanvasRef.current.getContext('2d');
                    ctx.fillStyle = "black"; ctx.fillRect(0,0, 128*zoom, 128*zoom);
                    ctx.fillStyle = "white";
                    for(let i=0; i<pixels.current.length; i++) {
                        if(pixels.current[i]) {
                            const r = Math.floor(i/128), c = i%128;
                            ctx.fillRect(c*zoom, r*zoom, zoom, zoom);
                        }
                    }
                }
            }, [tab, zoom]);

            // ── TEXT RENDER ─────────────────────────────────────────
            useEffect(() => {
                if (tab === "text" && textCanvasRef.current) {
                    const ctx = textCanvasRef.current.getContext('2d');
                    ctx.fillStyle = "black"; ctx.fillRect(0,0,128,128);
                    ctx.fillStyle = "white";
                    ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    ctx.font = `bold ${fontSize}px ${font}`;
                    const active = texts.slice(0, numLines);
                    const lh = fontSize * 1.1;
                    const startY = 64 - ((active.length - 1) * lh) / 2;
                    active.forEach((t, i) => {
                        const y = startY + i*lh;
                        ctx.strokeStyle = "black"; ctx.lineWidth = 4;
                        ctx.strokeText(t.toUpperCase(), 64, y);
                        ctx.fillText(t.toUpperCase(), 64, y);
                    });
                }
            }, [tab, texts, numLines, font, fontSize]);

            // ── PREPARE IMAGE ───────────────────────────────────────
            const parseAndSend = () => {
                const canvas = tab === "text" ? textCanvasRef.current : null;
                let data;
                if (canvas) {
                    const ctx = canvas.getContext('2d');
                    const img = ctx.getImageData(0,0,128,128).data;
                    data = new Uint8Array(2048); // 128*128bits / 8
                    for (let p=0; p<16; p++) {
                        for (let c=0; c<128; c++) {
                            let b = 0;
                            for (let bit=0; bit<8; bit++) {
                                const idx = ((p*8+bit)*128+c)*4;
                                if (img[idx] > 128) b |= (1 << bit);
                            }
                            data[p*128+c] = b;
                        }
                    }
                } else {
                    data = new Uint8Array(2048);
                    const px = pixels.current;
                    for (let p=0; p<16; p++) {
                        for (let c=0; c<128; c++) {
                            let b = 0;
                            for (let bit=0; bit<8; bit++) {
                                if (px[(p*8+bit)*128+c]) b |= (1 << bit);
                            }
                            data[p*128+c] = b;
                        }
                    }
                }
                sendData(data);
            };

            return (
                <div className="flex flex-col items-center min-h-screen p-4 max-w-lg mx-auto">
                    <div className="w-full flex justify-between items-center mb-4 bg-gray-900 p-3 rounded-2xl border border-gray-800">
                        <span className="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Status: {bleStatus}</span>
                        <button onClick={connect} className="bg-red-600 px-4 py-1 rounded-full text-[10px] font-black">CONECTAR BLE</button>
                    </div>

                    <div className="flex w-full gap-1 mb-4 bg-gray-900 p-1 rounded-xl">
                        <button onClick={() => setTab("text")} className={`flex-1 py-2 text-[10px] font-bold rounded-lg ${tab==="text"?"bg-black border border-red-600":"text-gray-500"}`}>MENSAJE</button>
                        <button onClick={() => setTab("draw")} className={`flex-1 py-2 text-[10px] font-bold rounded-lg ${tab==="draw"?"bg-black border border-red-600":"text-gray-500"}`}>DIBUJO LIBRE</button>
                    </div>

                    {tab === "text" ? (
                        <div className="w-full space-y-6">
                            <div className="oled-border mx-auto overflow-hidden rounded-lg bg-black group relative">
                                <canvas ref={textCanvasRef} width="128" height="128" className="grid-preview" />
                                <div className="absolute inset-0 bg-[radial-gradient(rgba(255,255,255,0.05)_1px,transparent_1px)] bg-[size:4px_4px] pointer-events-none"></div>
                            </div>
                            <div className="bg-gray-900 p-4 rounded-3xl space-y-4 border border-gray-800">
                                <div className="flex gap-1">
                                    {[1, 2, 3].map(n => (
                                        <button key={n} onClick={() => setNumLines(n)} className={`flex-1 py-2 text-[10px] rounded-lg border ${numLines===n?"bg-red-600 border-red-600":"border-gray-800 text-gray-500"}`}>{n} LIN</button>
                                    ))}
                                </div>
                                {texts.slice(0, numLines).map((t, i) => (
                                    <input key={i} value={t} onChange={e => { const n = [...texts]; n[i] = e.target.value; setTexts(n); }} className="w-full bg-black border border-gray-800 rounded-xl px-4 py-2 text-sm focus:border-red-600 outline-none" placeholder={`Línea ${i+1}`} />
                                ))}
                                <div className="grid grid-cols-4 gap-1">
                                    {["Russo One", "'Press Start 2P'", "Orbitron", "Bungee", "Permanent Marker", "Creepster", "VT323", "Audiowide"].map(f => (
                                        <button key={f} onClick={() => setFont(f)} className={`py-2 border rounded-lg text-[8px] truncate ${font===f?"border-red-600 text-red-500":"border-gray-800"}`} style={{fontFamily:f}}>{f}</button>
                                    ))}
                                </div>
                                <input type="range" min="10" max="50" value={fontSize} onChange={e => setFontSize(+e.target.value)} className="w-full h-1" />
                            </div>
                        </div>
                    ) : (
                        <div className="w-full space-y-4">
                            <div className="oled-border mx-auto overflow-auto rounded-lg bg-black border-red-600" style={{maxWidth:256, maxHeight:256}}>
                                <canvas 
                                    ref={gridCanvasRef} 
                                    width={128*zoom} height={128*zoom} 
                                    onMouseDown={(e) => { isDrawing.current = true; drawPixel(e); }}
                                    onMouseMove={drawPixel}
                                    onMouseUp={() => isDrawing.current = false}
                                    onMouseLeave={() => isDrawing.current = false}
                                    className="cursor-crosshair"
                                />
                            </div>
                            <div className="bg-gray-900 p-4 rounded-3xl flex flex-col gap-3 border border-gray-800">
                                <div className="flex justify-between items-center">
                                    <div className="flex gap-1">
                                        <button onClick={() => setTool("pen")} className={`w-10 h-10 rounded-xl border flex items-center justify-center ${tool==="pen"?"bg-red-600 border-red-600":"border-gray-800"}`}>✏️</button>
                                        <button onClick={() => setTool("eraser")} className={`w-10 h-10 rounded-xl border flex items-center justify-center ${tool==="eraser"?"bg-red-600 border-red-600":"border-gray-800"}`}>🧹</button>
                                    </div>
                                    <div className="flex gap-1">
                                        {[2, 4, 6, 8].map(z => (
                                            <button key={z} onClick={() => setZoom(z)} className={`w-8 h-8 rounded-lg border text-[10px] ${zoom===z?"text-red-500 border-red-600":"border-gray-800"}`}>{z}x</button>
                                        ))}
                                    </div>
                                    <button onClick={clearGrid} className="bg-red-950 text-red-500 border border-red-900 px-3 py-1 rounded-lg text-[10px]">BORRAR</button>
                                </div>
                                <div className="flex items-center gap-4">
                                    <span className="text-[10px] text-gray-500 uppercase">Grosor</span>
                                    <input type="range" min="1" max="8" value={brushSize} onChange={e => setBrushSize(+e.target.value)} className="flex-1 h-1" />
                                </div>
                            </div>
                        </div>
                    )}

                    <button onClick={parseAndSend} className="w-full mt-6 bg-red-600 hover:bg-red-500 text-white font-black py-4 rounded-3xl shadow-xl shadow-red-900/30 active:scale-95 transition-all tracking-widest text-sm">📡 ENVIAR AL NACHIMBONG</button>
                    <p className="mt-4 text-[10px] font-mono text-gray-500 tracking-tighter animate-pulse">{status}</p>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
