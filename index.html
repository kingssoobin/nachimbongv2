        .panel{background:#111;border:1px solid #222;border-radius:10px;padding:10px;width:100%;max-width:420px}
        button{padding:10px 12px;border-radius:10px;border:none;background:#ed1c24;color:#fff;cursor:pointer}
        select,input,textarea{width:100%;padding:8px;border-radius:8px;border:1px solid #333;background:#000;color:#ddd}
        #canvas{image-rendering:pixelated;border:2px solid #ed1c24;background:#000;width:256px;height:256px}
        .muted{color:#999;font-size:0.9em}
        .row{display:flex;gap:8px}
        .row > *{flex:1}
        #status{min-height:26px;color:#bdbdbd;font-size:0.95em}

<body>
  <h3>Nachimbong OLED Studio — Envío foto custom</h3>

  <canvas id="canvas" width="128" height="128"></canvas>

  <div class="panel">
    <div style="margin-bottom:8px" class="muted">Diseño cargado: <strong>wolfchan_mexa</strong></div>

    <label class="muted">Modo de envío</label>
    <select id="sendMode">
      <option value="normal">Normal (total=frames, frame=index, parts 0→15)</option>
      <option value="reverse">Reverse (partes 15→0)</option>
      <option value="swapHeader">SwapHeader (intercambia total<->frame)</option>
      <option value="bitFlip">BitFlip (invierte bits dentro de cada byte)</option>
      <option value="autoTry">Auto-Try (prueba Normal → Reverse → SwapHeader)</option>
    </select>

    <label class="muted" style="margin-top:8px">Delay entre partes (ms)</label>
    <input id="partDelay" type="number" value="140" />

    <div style="margin-top:10px" class="row">
      <button id="btnSend" onclick="startSend()">🖼️ ENVIAR WOLFCHAN</button>
      <button style="background:#3a3a3a" onclick="resetDevice()">🔁 REINICIAR</button>
    </div>

    <div id="status" style="margin-top:8px">Estado: esperando acción...</div>

    <div style="margin-top:10px">
      <label class="muted">Registro (console también)</label>
      <textarea id="log" readonly style="height:120px"></textarea>
    </div>
  </div>

/* ====== Utilidades y canvas (mínimas) ====== */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');
function log(msg){ logEl.value = (new Date()).toLocaleTimeString() + ' — ' + msg + '\n' + logEl.value; console.log(msg) }

/* Dibujar una previsualización simple del primer frame */
function renderPreviewFromHexParts(parts){
  try{
    const img = ctx.createImageData(128,128);
    // reconstruir a partir de partes de 128 bytes (little bit mapping como en frameImageDataToParts invocable inverso)
    const oled = new Uint8Array(2048);
    for(let p=0;p<parts.length && p<16;p++){
      const hex = parts[p];
      for(let i=0;i<128;i++){
        const b = parseInt(hex.substr(i*2,2),16);
        oled[p*128 + i] = b;
      }
    }
    // convertir a RGBA
    for(let y=0;y<128;y++){
      for(let x=0;x<128;x++){
        const byteIdx = Math.floor(y/8)*128 + x;
        const bit = (oled[byteIdx] >> (y%8)) & 1;
        const dst = (y*128 + x)*4;
        const v = bit ? 255 : 0;
        img.data[dst] = img.data[dst+1] = img.data[dst+2] = v;
        img.data[dst+3] = 255;
      }
    }
    ctx.putImageData(img,0,0);
  }catch(e){ console.error(e) }
}
renderPreviewFromHexParts(window.MIS_DISENOS?.wolfchan_mexa?.[0] || []);

/* ====== Helpers bridge ====== */
function sendCmd(cmd){
  log('Enviar: ' + cmd.slice(0,80) + (cmd.length>80 ? '...' : ''));
  if(window.bridge && typeof window.bridge.bleSendCmdList === 'function'){
    try{ window.bridge.bleSendCmdList(cmd); return true }catch(e){ log('Bridge error: ' + e) ; return false }
  }
  if(window.webkit?.messageHandlers?.bleSendCmdList){
    try{ window.webkit.messageHandlers.bleSendCmdList.postMessage(cmd); return true }catch(e){ log('webkit error: ' + e); return false }
  }
  log('Bridge no disponible: corre esto dentro de la app nativa.');
  return false;
}

function resetDevice(){
  log('Enviando comando de reset (8110,-)');
  try{
    if(window.bridge) window.bridge.bleSendCmdList("8110,-");
    else if(window.webkit?.messageHandlers?.bleSendCmdList) window.webkit.messageHandlers.bleSendCmdList.postMessage("8110,-");
    statusEl.innerText = 'Reset enviado';
  }catch(e){ statusEl.innerText = 'Error reset: ' + e; }
}

/* ====== Manipuladores de bits / util ====== */
function flipByteBits(b){
  let r = 0;
  for(let i=0;i<8;i++) r = (r<<1) | ((b>>i)&1);
  return r & 0xFF;
}
function partsFromOledBytes(oledBytes, bitFlip=false){
  const parts = [];
  for(let p=0;p<16;p++){
    const slice = oledBytes.slice(p*128, (p+1)*128);
    if(bitFlip){
      for(let i=0;i<slice.length;i++) slice[i] = flipByteBits(slice[i]);
    }
    parts.push(Array.from(slice).map(b=>b.toString(16).padStart(2,'0')).join(''));
  }
  return parts;
}

/* ====== Construir payload desde canvas RGBA -> 2048 bytes -> partes ====== */
function canvasToOledParts(bitFlip=false){
  const img = ctx.getImageData(0,0,128,128).data;
  const oled = new Uint8Array(2048);
  for(let y=0;y<128;y++){
    for(let x=0;x<128;x++){
      const idx = (y*128 + x)*4;
      if(img[idx] > 128){ // umbral simple
        const byteIdx = Math.floor(y/8)*128 + x;
        oled[byteIdx] |= (1 << (y%8));
      }
    }
  }
  return partsFromOledBytes(oled, bitFlip);
}

/* ====== Envío robusto con variantes del protocolo ====== */
async function sendMyDesignVariant(name, mode='normal', partDelay=140){
  const design = window.MIS_DISENOS?.[name];
  if(!design){ statusEl.innerText = 'Diseño no encontrado: ' + name; log('Diseño no encontrado'); return false; }
  statusEl.innerText = 'Enviando diseño "'+name+'" modo:'+mode;
  log('Inicio envío — modo: ' + mode);

  const totalFrames = design.length;
  // iterar frames (si el diseño tiene >1 frames, respetamos eso)
  for(let f=0; f<totalFrames; f++){
    const frameParts = design[f]; // array[16] hex strings
    // decide orden de partes
    let order = [...Array(16).keys()];
    if(mode === 'reverse') order = order.reverse();
    // construccion de encabezados
    const totalHex = totalFrames.toString(16).padStart(4,'0').toUpperCase();
    const frameHex = f.toString(16).padStart(4,'0').toUpperCase();

    for(let i=0;i<order.length;i++){
      const p = order[i];
      let payloadHex = frameParts[p] || ''.padEnd(128*2,'0');

      // si mode bitFlip: debemos invertir bits de cada byte antes de hex
      if(mode === 'bitFlip'){
        // convertir payloadHex -> bytes -> flip -> back to hex
        const buf = new Uint8Array(128);
        for(let j=0;j<128;j++) buf[j] = parseInt(payloadHex.substr(j*2,2),16) || 0;
        for(let j=0;j<128;j++) buf[j] = flipByteBits(buf[j]);
        payloadHex = Array.from(buf).map(b=>b.toString(16).padStart(2,'0')).join('');
      }

      // elegir header segun modo swapHeader o normal
      let cmdHeader;
      if(mode === 'swapHeader'){
        // 810F + frameHex + totalHex + part
        const partHex = p.toString(16).padStart(2,'0').toUpperCase();
        cmdHeader = `810F${frameHex}${totalHex}${partHex}`;
      } else {
        // normal: 810F + totalHex + frameHex + part
        const partHex = p.toString(16).padStart(2,'0').toUpperCase();
        cmdHeader = `810F${totalHex}${frameHex}${partHex}`;
      }

      const cmd = cmdHeader + payloadHex + ",-";
      const ok = sendCmd(cmd);
      if(!ok){ statusEl.innerText = 'Bridge no disponible'; return false; }
      statusEl.innerText = `Enviando frame ${f+1}/${totalFrames} parte ${p+1}/16`;
      await new Promise(r=>setTimeout(r, partDelay));
    }
    // pequeño delay entre frames
    await new Promise(r=>setTimeout(r, partDelay + 60));
  }

  // comando play (final)
  sendCmd("810E01,-");
  statusEl.innerText = 'Envío terminado — comando PLAY enviado';
  log('Play enviado');
  return true;
}

/* ====== Auto-try: intenta varias variantes en secuencia (para encontrar la compatible) ====== */
async function sendMyDesignAuto(name){
  const delay = parseInt(document.getElementById('partDelay').value) || 140;
  const modes = ['normal','reverse','swapHeader','bitFlip'];
  for(let m of modes){
    log('AutoTry: intentando modo ' + m);
    await sendMyDesignVariant(name, m, delay);
    // esperar unos segundos para que puedas observar el resultado en el stick
    await new Promise(r=>setTimeout(r, 2200));
  }
  log('AutoTry completo');
}

/* ====== Inicio del envío según selector ====== */
async function startSend(){
  const mode = document.getElementById('sendMode').value;
  const delay = parseInt(document.getElementById('partDelay').value) || 140;
  document.getElementById('btnSend').disabled = true;
  try{
    if(mode === 'autoTry'){
      await sendMyDesignAuto('wolfchan_mexa');
    } else {
      await sendMyDesignVariant('wolfchan_mexa', mode, delay);
    }
    statusEl.innerText = 'Operación finalizada';
  }catch(e){
    statusEl.innerText = 'Error envío: ' + e;
    log('Error: ' + e);
  }finally{
    document.getElementById('btnSend').disabled = false;
  }
}
