<!-- PANEL DE DIAGNÓSTICO: enviar partes de prueba -->
<div id="diagPanel" style="width:100%;max-width:360px;margin:12px auto;background:#111;border:1px solid #222;border-radius:10px;padding:8px;color:#ddd;">
  <div style="font-size:0.85rem;margin-bottom:8px;">🔧 Diagnóstico BLE / formato</div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;">
    <button onclick="diag_sendPart(0)" class="main-btn small">Enviar parte 0</button>
    <button onclick="diag_sendPart(1)" class="main-btn small">Enviar parte 1</button>
    <button onclick="diag_sendPart(15)" class="main-btn small">Enviar parte 15</button>
    <button onclick="diag_sendAllWhite('normal')" class="main-btn small">Todas blancas (normal)</button>
    <button onclick="diag_sendAllWhite('reverse')" class="main-btn small">Todas blancas (reverse)</button>
    <button onclick="diag_sendAllWhite('swapHeader')" class="main-btn small">Todas blancas (swapHdr)</button>
    <button onclick="diag_sendAllWhite('bitFlip')" class="main-btn small">Todas blancas (bitFlip)</button>
  </div>
  <div id="diagLog" style="font-size:0.8rem;color:#aaa;margin-top:8px;min-height:28px;">Estado diagnóstico...</div>
</div>

<script>
/*
  Funciones de diagnóstico para enviar patrones sencillos y probar formato.
  - diag_sendPart(n): envía la parte n con todos los bytes = 0xFF (debería encender la franja correspondiente).
  - diag_sendAllWhite(mode): envía todas las partes con variantes:
      - "normal": encabezado 810F total=0001 frame=0000 part=pp
      - "reverse": envía partes en orden 15..0 (para ver si el orden esperado está invertido)
      - "swapHeader": prueba encabezado con frame/total intercambiados (810F frame total ...)
      - "bitFlip": invierte bits dentro de cada byte (por si LSB/MSB esperado distinto)
  Observa la pantalla y sube foto o dime qué zona se iluminó.
*/

function logDiag(txt){
  const el = document.getElementById('diagLog');
  el.innerText = txt;
  console.log('[DIAG]', txt);
}

function sendCmdRaw(cmd){
  // Envía al bridge (o al webkit handler). Muestra en consola el cmd.
  console.log('CMD ->', cmd.slice(0,80)+'...'); // trunca para no saturar
  if(window.bridge && typeof window.bridge.bleSendCmdList === 'function'){
    window.bridge.bleSendCmdList(cmd);
    return true;
  } else if(window.webkit?.messageHandlers?.bleSendCmdList){
    window.webkit.messageHandlers.bleSendCmdList.postMessage(cmd);
    return true;
  } else {
    logDiag('Bridge no disponible. Ejecuta esto dentro de la app nativa.');
    return false;
  }
}

function makeFullPartHex(bitFlip=false){
  // Crea 128 bytes de 0xFF (todo blanco). Devuelve string hex (256 chars)
  const arr = new Array(128).fill(0xFF);
  if(bitFlip){
    // invertir bits en cada byte (ej: 0xFF -> 0xFF igual, pero útil si pruebas otros valores)
    for(let i=0;i<arr.length;i++){
      let b = arr[i];
      let rev = 0;
      for(let j=0;j<8;j++) rev = (rev<<1) | ((b>>j)&1);
      arr[i] = rev;
    }
  }
  return arr.map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function diag_sendPart(partIndex){
  logDiag('Enviando parte ' + partIndex + ' (full white)...');
  const hex = makeFullPartHex(false);
  // header: 810F + total(0001) + frame(0000) + part(2 hex)
  const totalHex = '0001';
  const frameHex = '0000';
  const partHex = partIndex.toString(16).padStart(2,'0').toUpperCase();
  const cmd = `810F${totalHex}${frameHex}${partHex}${hex},-`;
  const ok = sendCmdRaw(cmd);
  if(ok) logDiag('Comando enviado: parte ' + partIndex);
}

async function diag_sendAllWhite(mode){
  logDiag('Modo diagnóstico: ' + mode);
  const hex = makeFullPartHex(mode==='bitFlip');
  const totalHex_normal = '0001';
  const frameHex_normal = '0000';
  const totalHex_alt = '0010'; // pruebo como ejemplo (16)
  const frameHex_alt = '0000';
  let order = [...Array(16).keys()];
  if(mode === 'reverse') order = order.reverse();
  // si swapHeader: mandamos header 810F frameHex + totalHex (prueba)
  // if mode bitFlip already handled in hex
  for(let i=0;i<order.length;i++){
    const p = order[i];
    let cmd;
    if(mode === 'swapHeader'){
      // prueba: 810F + frame + total + part + payload
      const frame = totalHex_normal; // intercambiados
      const total = frameHex_normal;
      const partHex = p.toString(16).padStart(2,'0').toUpperCase();
      cmd = `810F${frame}${total}${partHex}${hex},-`;
    } else if(mode === 'normal' || mode === 'bitFlip' || mode === 'reverse'){
      // normal header
      const partHex = p.toString(16).padStart(2,'0').toUpperCase();
      // Para probar otra hipótesis (que el dispositivo trate "total" como 16),
      // cuando mode === 'reverse' también pruebo enviar total=0010 (16) en paralelo:
      const totalHex = (mode==='reverse') ? '0010' : totalHex_normal;
      cmd = `810F${totalHex}${frameHex_normal}${partHex}${hex},-`;
    } else {
      cmd = `810F${totalHex_normal}${frameHex_normal}${p.toString(16).padStart(2,'0')}${hex},-`;
    }

    const ok = sendCmdRaw(cmd);
    if(!ok) return;
    // esperar un poco entre partes
    await new Promise(r=>setTimeout(r, 180));
  }
  // play final
  sendCmdRaw("810E01,-");
  logDiag('Secuencia de prueba enviada ('+mode+').');
}
</script>
