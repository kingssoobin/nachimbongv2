<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OLEDSTUDIO - SKZ NACHIMBONG V2</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>SKZ NACHIMBONG V2 • OLED STUDIO</h1>
    <div id="status">Listo para conectar...</div>
  </header>

  <main>
    <section id="preview">
      <canvas id="canvas" width="128" height="128" style="background:black; border:1px solid #444"></canvas>
      <div class="controls">
        <button onclick="clearCanvas()">🧹</button>
        <button onclick="saveCanvas()">🔁</button>
      </div>
    </section>

    <section id="editor">
      <h3>✏️ Editor de Texto</h3>
      <div>
        <input id="line1" placeholder="Linea 1" />
        <input id="line2" placeholder="Linea 2" />
        <input id="line3" placeholder="Linea 3" />
        <div>
          <button class="line-btn" onclick="setLines(1, this)">1L</button>
          <button class="line-btn" onclick="setLines(2, this)">2L</button>
          <button class="line-btn" onclick="setLines(3, this)">3L</button>
        </div>
        <div>
          <button class="font-btn" data-font="Arial" onclick="selectFont(this)">Arial</button>
          <button class="font-btn" data-font="Pixel" onclick="selectFont(this)">Pixel</button>
          <input id="fontSize" type="range" min="8" max="48" value="24" oninput="document.getElementById('sizeVal').innerText=this.value">
          <span id="sizeVal">24</span>px
        </div>
        <div>
          <button onclick="applyText()">Aplicar Texto</button>
        </div>
      </div>
    </section>

    <section id="emojis">
      <h3>😀 Emojis</h3>
      <div>
        <button onclick="showEmojiCat('fav', this)" class="emoji-tab">⭐</button>
        <button onclick="showEmojiCat('faces', this)" class="emoji-tab">🙂</button>
        <button onclick="showEmojiCat('nature', this)" class="emoji-tab">🌿</button>
      </div>
      <div id="emojiGrid"></div>
    </section>

    <section id="designs">
      <h3>Diseños / Animaciones</h3>
      <!-- Botones de mostrar en canvas (preview) -->
      <div class="design-buttons">
        <button onclick="loadDesign('Wolfchan Mexa')">Mostrar en canva a Wolfchan Mexa</button>
        <button onclick="loadDesign('Bangchan AN01')">Mostrar en canva a Bangchan AN01</button>
      </div>

      <!-- === Botones de envío: 2 botones para enviar al dispositivo === -->
      <div class="send-buttons">
        <!-- Mantener el id original para compatibilidad con app.js -->
        <button id="sendBtn" class="sendBtn">📡 Enviar al Nachimbong el Bangchan AN01</button>

        <!-- Nuevo botón de envío. Si quieres que envíe lo que haya en canvas, quita data-design -->
        <button class="sendBtn" data-design="Wolfchan Mexa">📡 Enviar al Nachimbong a Wolfchan Mexa</button>
      </div>

      <div>
        <button id="btReconnect" onclick="initBT()">🔄 Reconectar Bluetooth</button>
      </div>

      <div>
        <label for="renderMode">Modo vista:</label>
        <select id="renderMode">
          <option value="standard">Estándar</option>
          <option value="revbit">Bits invertidos</option>
          <option value="transpose">Transponer (rotar)</option>
          <option value="invert">Invertir colores</option>
        </select>
        <button id="applyRenderMode">Aplicar</button>
      </div>

    </section>
  </main>

  <footer>
    <small>128x128px • MONOCHROME OLED</small>
  </footer>

  <!-- Scripts principales existentes -->
  <script src="conect.js"></script>
  <script src="app.js"></script>
  <!-- Nuestro patch para enlazar múltiples botones de envío -->
  <script src="send-buttons-patch.js"></script>
</body>
</html>
