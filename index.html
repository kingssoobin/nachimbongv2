<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nachimbong v2 - Editor</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- --- Contenido principal de la página --- -->
  <div id="app">
    <!-- Aquí va tu editor, canvas, controles, etc. (no se tocó el resto) -->
    <header>
      <h1>Nachimbong v2</h1>
    </header>

    <main>
      <!-- Panel de texto / líneas / visor / demás controles existentes -->
      <section id="editor-area">
        <!-- Conserva tu HTML actual para el editor de texto -->
      </section>

      <!-- Visor de animaciones / canvas -->
      <section id="preview-area">
        <canvas id="displayCanvas" width="64" height="32"></canvas>
      </section>
    </main>
  </div>

  <!-- --- Botones principales al pie (mantengo la clase main-btn para estilos) --- -->
  <footer id="bottom-buttons" class="controls">
    <div class="btn-row">
      <button id="showWolfchanBtn" class="main-btn">Mostrar Wolfchan Mexa</button>
      <button id="sendWolfchanBtn" class="main-btn">Enviar Wolfchan Mexa</button>
    </div>
    <div class="btn-row">
      <button id="showBangchanBtn" class="main-btn">Mostrar Bangchan AN01</button>
      <button id="sendBangchanBtn" class="main-btn">Enviar Bangchan AN01</button>
    </div>
    <div class="btn-row">
      <button id="sendBtn" class="main-btn">Enviar al Nachimbong</button>
      <button id="resetBtn" class="main-btn">🔁</button>
    </div>
  </footer>

  <!-- --- SCRIPTS: Asegúrate que los JS de diseños se carguen ANTES de app.js --- -->
  <!-- Por ejemplo: -->
  <script src="bangchan_an01.js"></script>
  <script src="wolfchan_mexa.js"></script>

  <!-- Tu app.js principal (reemplazar o mantener si ya existe; este es el corregido) -->
  <script src="app.js"></script>
</body>
</html>
