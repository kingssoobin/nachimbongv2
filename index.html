<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nachimbong OLED Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@700&family=Bangers&family=Permanent+Marker&family=VT323&family=Righteous&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            text-align: center;
            background: #0a0a0a;
            color: #eee;
            padding: 12px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        h2 { color: #ed1c24; font-size: 1.1rem; letter-spacing: 2px; }

        #canvas {
            border: 2px solid #ed1c24;
            background: #000;
            width: 240px; height: 240px;
            image-rendering: pixelated;
            touch-action: none;
            border-radius: 6px;
            box-shadow: 0 0 18px rgba(237,28,36,0.3);
        }

        /* TABS */
        .tabs { display: flex; gap: 6px; width: 100%; max-width: 340px; }
        .tab {
            flex: 1; padding: 8px 4px; border-radius: 10px 10px 0 0;
            border: 1px solid #333; border-bottom: none;
            background: #111; color: #666; cursor: pointer; font-size: 0.7rem; font-weight: bold;
        }
        .tab.active { background: #1a1a1a; color: #ed1c24; border-color: #ed1c24; }

        .panel {
            display: none; background: #1a1a1a; border: 1px solid #333;
            border-radius: 0 0 12px 12px; padding: 12px;
            width: 100%; max-width: 340px;
        }
        .panel.active { display: flex; flex-direction: column; gap: 8px; }

        /* TEXT PANEL */
        .panel label { font-size: 0.65rem; color: #666; text-align: left; text-transform: uppercase; letter-spacing: 1px; }
        .panel input[type="text"] {
            width: 100%; padding: 9px 14px; border-radius: 20px;
            border: 1px solid #444; background: #000; color: white; font-size: 1rem; outline: none;
        }
        .panel input[type="text"]:focus { border-color: #ed1c24; }

        .font-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .font-btn {
            padding: 7px 4px; border-radius: 8px; border: 1px solid #444;
            background: #000; color: white; cursor: pointer; font-size: 0.7rem; text-align: center;
        }
        .font-btn.active { border-color: #ed1c24; color: #ed1c24; background: #1a0000; }
        .font-btn span { display: block; font-size: 1rem; margin-bottom: 2px; }

        .size-row { display: flex; align-items: center; gap: 8px; }
        .size-row input[type="range"] { flex: 1; accent-color: #ed1c24; }
        .size-row span { font-size: 0.8rem; color: #888; min-width: 30px; }

        #applyTextBtn {
            padding: 10px; border-radius: 20px; border: none;
            background: #ed1c24; color: white; font-weight: bold; cursor: pointer; font-size: 0.85rem;
        }

        /* SKZOO GALLERY */
        .skzoo-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px;
        }
        .skzoo-item {
            aspect-ratio: 1; background: #000; border: 1px solid #333;
            border-radius: 8px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer;
            transition: transform 0.1s; overflow: hidden; padding: 4px;
        }
        .skzoo-item:active { transform: scale(0.9); border-color: #ed1c24; }
        .skzoo-item svg { width: 52px; height: 52px; }
        .skzoo-item span { font-size: 0.5rem; color: #888; margin-top: 2px; }

        /* EMOJI GALLERY */
        .emoji-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .emoji-item {
            aspect-ratio: 1; background: #000; border: 1px solid #333;
            border-radius: 6px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 1.3rem; transition: transform 0.1s;
        }
        .emoji-item:active { transform: scale(0.9); border-color: #ed1c24; }

        /* CONTROLS */
        .controls { display: flex; flex-direction: column; gap: 7px; width: 100%; max-width: 340px; }
        .btn-row { display: flex; gap: 7px; }
        .main-btn {
            flex: 1; padding: 13px; font-weight: bold; border-radius: 25px;
            border: none; cursor: pointer; font-size: 0.85rem;
        }
        #sendBtn { background: #ed1c24; color: white; }
        #clearBtn { background: #222; color: #aaa; border: 1px solid #333; }
        #reconnectBtn { background: #000; color: #1e90ff; border: 1px solid #1e90ff; }
        #resetDevBtn { background: #000; color: #ff9900; border: 1px solid #ff9900; }
        #status { color: #888; font-size: 0.75em; min-height: 18px; }

        /* Draw tools */
        .draw-tools { display: flex; gap: 6px; align-items: center; justify-content: center; }
        .tool-btn {
            padding: 6px 12px; border-radius: 10px; border: 1px solid #444;
            background: #000; color: #aaa; cursor: pointer; font-size: 0.7rem;
        }
        .tool-btn.active { border-color: #ed1c24; color: #ed1c24; }
        .brush-size { display: flex; align-items: center; gap: 5px; font-size: 0.7rem; color: #666; }
        .brush-size input { width: 70px; accent-color: #ed1c24; }
    </style>
</head>
<body>

<h2>⚡ OLED STUDIO ⚡</h2>

<canvas id="canvas" width="128" height="128"></canvas>

<!-- Draw tools -->
<div class="draw-tools">
    <button class="tool-btn active" id="toolDraw" onclick="setTool('draw')">✏️ Dibujar</button>
    <button class="tool-btn" id="toolErase" onclick="setTool('erase')">🧹 Borrar</button>
    <div class="brush-size">
        <span>Tamaño:</span>
        <input type="range" id="brushSize" min="1" max="12" value="4">
    </div>
</div>

<!-- TABS -->
<div class="tabs">
    <div class="tab active" onclick="switchTab('text')">✏️ TEXTO</div>
    <div class="tab" onclick="switchTab('skzoo')">🐾 SKZOO</div>
    <div class="tab" onclick="switchTab('emoji')">😊 ICONOS</div>
</div>

<!-- TEXT PANEL -->
<div class="panel active" id="panel-text">
    <label>Escribe tu texto:</label>
    <input type="text" id="textInput" placeholder="Ej: STAY ♡" maxlength="20">
    <label>Fuente:</label>
    <div class="font-grid">
        <button class="font-btn active" data-font="Arial" onclick="selectFont(this)">
            <span style="font-family:Arial;font-weight:bold">Aa</span>Normal
        </button>
        <button class="font-btn" data-font="'Press Start 2P'" onclick="selectFont(this)">
            <span style="font-family:'Press Start 2P';font-size:0.7rem">Aa</span>Pixel
        </button>
        <button class="font-btn" data-font="Orbitron" onclick="selectFont(this)">
            <span style="font-family:Orbitron">Aa</span>Orbit
        </button>
        <button class="font-btn" data-font="Bangers" onclick="selectFont(this)">
            <span style="font-family:Bangers;font-size:1.2rem">Aa</span>Bangers
        </button>
        <button class="font-btn" data-font="'Permanent Marker'" onclick="selectFont(this)">
            <span style="font-family:'Permanent Marker'">Aa</span>Marker
        </button>
        <button class="font-btn" data-font="VT323" onclick="selectFont(this)">
            <span style="font-family:VT323;font-size:1.3rem">Aa</span>VT323
        </button>
        <button class="font-btn" data-font="Righteous" onclick="selectFont(this)">
            <span style="font-family:Righteous">Aa</span>Righteous
        </button>
        <button class="font-btn" data-font="serif" onclick="selectFont(this)">
            <span style="font-family:serif">Aa</span>Serif
        </button>
        <button class="font-btn" data-font="monospace" onclick="selectFont(this)">
            <span style="font-family:monospace">Aa</span>Mono
        </button>
    </div>
    <label>Tamaño: <span id="sizeVal">24</span>px</label>
    <div class="size-row">
        <input type="range" id="fontSize" min="8" max="60" value="24" oninput="document.getElementById('sizeVal').innerText=this.value">
    </div>
    <button id="applyTextBtn" onclick="applyText()">APLICAR AL CANVAS</button>
</div>

<!-- SKZOO PANEL -->
<div class="panel" id="panel-skzoo">
    <div class="skzoo-grid" id="skzooGrid"></div>
</div>

<!-- EMOJI PANEL -->
<div class="panel" id="panel-emoji">
    <div class="emoji-grid">
        <div class="emoji-item" onclick="loadIcon('❤️')">❤️</div>
        <div class="emoji-item" onclick="loadIcon('⭐')">⭐</div>
        <div class="emoji-item" onclick="loadIcon('⚡')">⚡</div>
        <div class="emoji-item" onclick="loadIcon('🔥')">🔥</div>
        <div class="emoji-item" onclick="loadIcon('👑')">👑</div>
        <div class="emoji-item" onclick="loadIcon('🐺')">🐺</div>
        <div class="emoji-item" onclick="loadIcon('🌙')">🌙</div>
        <div class="emoji-item" onclick="loadIcon('✨')">✨</div>
        <div class="emoji-item" onclick="loadIcon('🎵')">🎵</div>
        <div class="emoji-item" onclick="loadIcon('💎')">💎</div>
        <div class="emoji-item" onclick="loadIcon('🦋')">🦋</div>
        <div class="emoji-item" onclick="loadIcon('🌸')">🌸</div>
        <div class="emoji-item" onclick="loadIcon('🎸')">🎸</div>
        <div class="emoji-item" onclick="loadIcon('🏆')">🏆</div>
        <div class="emoji-item" onclick="loadIcon('💀')">💀</div>
    </div>
</div>

<!-- CONTROLS -->
<div class="controls">
    <div class="btn-row">
        <button class="main-btn" id="clearBtn" onclick="clearCanvas()">🧹 LIMPIAR</button>
        <button class="main-btn" id="sendBtn" onclick="transferOled()">📡 ENVIAR</button>
    </div>
    <div class="btn-row">
        <button class="main-btn" id="reconnectBtn" onclick="initBT()">🔄 RECONECTAR BT</button>
        <button class="main-btn" id="resetDevBtn" onclick="resetDevice()">🔁 REINICIAR DISP.</button>
    </div>
    <div id="status">Iniciando...</div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const status = document.getElementById('status');
let isDrawing = false;
let selectedFont = "Arial";
let currentTool = 'draw';

// ===================== SKZOO SVG DEFINITIONS =====================
const SKZOO = [
    {
        name: "WolfChan", member: "Chan",
        draw: (c) => {
            // Wolf - grey wolf with dimples
            c.fillStyle="#ddd"; c.beginPath(); c.ellipse(64,72,30,28,0,0,Math.PI*2); c.fill();
            // ears
            c.fillStyle="#bbb";
            c.beginPath(); c.moveTo(38,50); c.lineTo(30,28); c.lineTo(52,44); c.fill();
            c.beginPath(); c.moveTo(90,50); c.lineTo(98,28); c.lineTo(76,44); c.fill();
            // inner ears
            c.fillStyle="#fff"; c.beginPath(); c.moveTo(40,48); c.lineTo(34,32); c.lineTo(50,44); c.fill();
            c.beginPath(); c.moveTo(88,48); c.lineTo(94,32); c.lineTo(78,44); c.fill();
            // face
            c.fillStyle="#eee"; c.beginPath(); c.ellipse(64,76,22,20,0,0,Math.PI*2); c.fill();
            // eyes
            c.fillStyle="#222"; c.beginPath(); c.arc(54,68,4,0,Math.PI*2); c.fill();
            c.beginPath(); c.arc(74,68,4,0,Math.PI*2); c.fill();
            // eye shine
            c.fillStyle="#fff"; c.beginPath(); c.arc(56,66,1.5,0,Math.PI*2); c.fill();
            c.beginPath(); c.arc(76,66,1.5,0,Math.PI*2); c.fill();
            // nose
            c.fillStyle="#555"; c.beginPath(); c.ellipse(64,76,5,3,0,0,Math.PI*2); c.fill();
            // mouth
            c.strokeStyle="#555"; c.lineWidth=1.5; c.beginPath(); c.moveTo(59,80); c.quadraticCurveTo(64,85,69,80); c.stroke();
            // dimples
            c.fillStyle="rgba(200,150,150,0.5)"; c.beginPath(); c.arc(50,80,4,0,Math.PI*2); c.fill();
            c.beginPath(); c.arc(78,80,4,0,Math.PI*2); c.fill();
            // fur texture lines
            c.strokeStyle="#bbb"; c.lineWidth=1;
            c.beginPath(); c.moveTo(35,60); c.lineTo(42,65); c.stroke();
            c.beginPath(); c.moveTo(93,60); c.lineTo(86,65); c.stroke();
        }
    },
    {
        name: "Leebit", member: "Lee Know",
        draw: (c) => {
            // Rabbit - white with big front teeth
            c.fillStyle="#f0f0f0"; c.beginPath(); c.ellipse(64,76,28,26,0,0,Math.PI*2); c.fill();
            // long ears
            c.fillStyle="#f0f0f0";
            c.beginPath(); c.ellipse(50,38,10,28,-.2,0,Math.PI*2); c.fill();
            c.beginPath(); c.ellipse(78,38,10,28,.2,0,Math.PI*2); c.fill();
            // inner ears pink
            c.fillStyle="#ffb6c1";
            c.beginPath(); c.ellipse(50,38,5,22,-.2,0,Math.PI*2); c.fill();
            c.beginPath(); c.ellipse(78,38,5,22,.2,0,Math.PI*2); c.fill();
            // face
            c.fillStyle="#fff"; c.beginPath(); c.ellipse(64,80,20,18,0,0,Math.PI*2); c.fill();
            // mischievous eyes (half closed)
            c.fillStyle="#333"; c.beginPath(); c.arc(55,72,4,0,Math.PI*2); c.fill();
            c.beginPath(); c.arc(73,72,4,0,Math.PI*2); c.fill();
            c.fillStyle="#fff"; c.beginPath(); c.arc(57,70,1.5,0,Math.PI*2); c.fill();
            c.beginPath(); c.arc(75,70,1.5,0,Math.PI*2); c.fill();
            // eyelid (mischievous)
            c.fillStyle="#f0f0f0"; c.beginPath(); c.arc(55,72,4,Math.PI,0); c.fill();
            c.beginPath(); c.arc(73,72,4,Math.PI,0); c.fill();
            // nose
            c.fillStyle="#ffb6c1"; c.beginPath(); c.ellipse(64,79,4,3,0,0,Math.PI*2); c.fill();
            // big front teeth
            c.fillStyle="#fff"; c.strokeStyle="#ddd"; c.lineWidth=1;
            c.fillRect(59,83,6,8); c.strokeRect(59,83,6,8);
            c.fillRect(66,83,6,8); c.strokeRect(66,83,6,8);
            c.strokeStyle="#ddd"; c.beginPath(); c.moveTo(65,83); c.lineTo(65,91); c.stroke();
        }
    },
    {
        name: "Dwaekki", member: "Changbin",
        draw: (c) => {
            // Pig-rabbit hybrid
            c.fillStyle="#ffb6c1"; c.beginPath(); c.ellipse(64,74,30,28,0,0,Math.PI*2); c.fill();
            // rabbit ears on pig
            c.fillStyle="#ffb6c1";
            c.beginPath(); c.ellipse(46,36,9,24,-.15,0,Math.PI*2); c.fill();
            c.beginPath(); c.ellipse(82,36,9,24,.15,0,Math.PI*2); c.fill();
            c.fillStyle="#ff9eb5";
            c.beginPath(); c.ellipse(46,36,4,18,-.15,0,Math.PI*2); c.fill();
            c.beginPath(); c.ellipse(82,36,4,18,.15,0,Math.PI*2); c.fill();
            // face
            c.fillStyle="#ffc8d8"; c.beginPath(); c.ellipse(64,78,22,20,0,0,Math.PI*2); c.fill();
            // eyes (determined/strong)
            c.fillStyle="#222"; c.beginPath(); c.arc(54,70,4,0,Math.PI*2); c.fill();
            c.beginPath(); c.arc(74,70,4,0,Math.PI*2); c.fill();
            c.fillStyle="#fff"; c.beginPath(); c.arc(56,68,1.5,0,Math.PI*2); c.fill();
            c.beginPath(); c.arc(76,68,1.5,0,Math.PI*2); c.fill();
            // pig snout
            c.fillStyle="#ff9eb5"; c.beginPath(); c.ellipse(64,80,10,7,0,0,Math.PI*2); c.fill();
            c.fillStyle="#ff7a9a"; c.beginPath(); c.arc(60,80,2.5,0,Math.PI*2); c.fill();
            c.beginPath(); c.arc(68,80,2.5,0,Math.PI*2); c.fill();
            // smile
            c.strokeStyle="#d4607a"; c.lineWidth=1.5;
            c.beginPath(); c.moveTo(56,87); c.quadraticCurveTo(64,93,72,87); c.stroke();
            // chubby cheeks
            c.fillStyle="rgba(255,100,130,0.3)"; c.beginPath(); c.arc(46,76,8,0,Math.PI*2); c.fill();
            c.beginPath(); c.arc(82,76,8,0,Math.PI*2); c.fill();
        }
    },
    {
        name: "Jiniret", member: "Hyunjin",
        draw: (c) => {
            // Ferret - elegant, long face
            c.fillStyle="#c8a87a"; c.beginPath(); c.ellipse(64,70,26,30,0,0,Math.PI*2); c.fill();
            // small round ears
            c.fillStyle="#c8a87a"; c.beginPath(); c.arc(44,46,10,0,Math.PI*2); c.fill();
            c.beginPath(); c.arc(84,46,10,0,Math.PI*2); c.fill();
            c.fillStyle="#e8c8a0"; c.beginPath(); c.arc(44,46,6,0,Math.PI*2); c.fill();
            c.beginPath(); c.arc(84,46,6,0,Math.PI*2); c.fill();
            // face mask (ferret dark mask)
            c.fillStyle="#5a3a1a"; c.beginPath(); c.ellipse(64,68,18,12,0,0,Math.PI*2); c.fill();
            // white muzzle
            c.fillStyle="#f5e8d0"; c.beginPath(); c.ellipse(64,76,12,10,0,0,Math.PI*2); c.fill();
            // elegant eyes
            c.fillStyle="#111"; c.beginPath(); c.arc(54,65,4,0,Math.PI*2); c.fill();
            c.beginPath(); c.arc(74,65,4,0,Math.PI*2); c.fill();
            c.fillStyle="#fff"; c.beginPath(); c.arc(56,63,1.5,0,Math.PI*2); c.fill();
            c.beginPath(); c.arc(76,63,1.5,0,Math.PI*2); c.fill();
            // nose
            c.fillStyle="#8b4513"; c.beginPath(); c.ellipse(64,74,4,3,0,0,Math.PI*2); c.fill();
            // whiskers
            c.strokeStyle="#888"; c.lineWidth=1;
            for(let i=0;i<3;i++){
                c.beginPath(); c.moveTo(64,76); c.lineTo(38,70+i*5); c.stroke();
                c.beginPath(); c.moveTo(64,76); c.lineTo(90,70+i*5); c.stroke();
            }
            // graceful smile
            c.strokeStyle="#8b4513"; c.lineWidth=1.5;
            c.beginPath(); c.moveTo(58,80); c.quadraticCurveTo(64,86,70,80); c.stroke();
        }
    },
    {
        name: "HanQuokka", member: "Han",
        draw: (c) => {
            // Quokka - chubby cheeks, happy
            c.fillStyle="#c8a060"; c.beginPath(); c.ellipse(64,74,30,28,0,0,Math.PI*2); c.fill();
            // round ears
            c.fillStyle="#c8a060"; c.beginPath(); c.arc(40,50,12,0,Math.PI*2); c.fill();
            c.beginPath(); c.arc(88,50,12,0,Math.PI*2); c.fill();
            c.fillStyle="#e8c080"; c.beginPath(); c.arc(40,50,7,0,Math.PI*2); c.fill();
            c.beginPath(); c.arc(88,50,7,0,Math.PI*2); c.fill();
            // face
            c.fillStyle="#e0b870"; c.beginPath(); c.ellipse(64,78,24,22,0,0,Math.PI*2); c.fill();
            // HUGE chubby cheeks (quokka signature)
            c.fillStyle="#d4a060"; c.beginPath(); c.ellipse(42,80,14,12,0,0,Math.PI*2); c.fill();
            c.beginPath(); c.ellipse(86,80,14,12,0,0,Math.PI*2); c.fill();
            // eyes (happy squinting)
            c.fillStyle="#222"; c.beginPath(); c.arc(54,70,4,0,Math.PI*2); c.fill();
            c.beginPath(); c.arc(74,70,4,0,Math.PI*2); c.fill();
            c.fillStyle="#fff"; c.beginPath(); c.arc(56,68,1.5,0,Math.PI*2); c.fill();
            c.beginPath(); c.arc(76,68,1.5,0,Math.PI*2); c.fill();
            // nose
            c.fillStyle="#8b5a2b"; c.beginPath(); c.ellipse(64,77,5,3,0,0,Math.PI*2); c.fill();
            // BIG happy smile (quokka always smiling)
            c.strokeStyle="#8b5a2b"; c.lineWidth=2;
            c.beginPath(); c.moveTo(52,83); c.quadraticCurveTo(64,95,76,83); c.stroke();
        }
    },
    {
        name: "Bbokari", member: "Felix",
        draw: (c) => {
            // Chick - bright yellow, cute
            c.fillStyle="#FFD700"; c.beginPath(); c.ellipse(64,76,30,28,0,0,Math.PI*2); c.fill();
            // fluffy head
            c.fillStyle="#FFE44D"; c.beginPath(); c.arc(64,56,22,0,Math.PI*2); c.fill();
            // wing bumps
            c.fillStyle="#FFC200"; c.beginPath(); c.ellipse(36,80,12,10,-.3,0,Math.PI*2); c.fill();
            c.beginPath(); c.ellipse(92,80,12,10,.3,0,Math.PI*2); c.fill();
            // eyes (big bright)
            c.fillStyle="#222"; c.beginPath(); c.arc(54,54,5,0,Math.PI*2); c.fill();
            c.beginPath(); c.arc(74,54,5,0,Math.PI*2); c.fill();
            c.fillStyle="#fff"; c.beginPath(); c.arc(56,52,2,0,Math.PI*2); c.fill();
            c.beginPath(); c.arc(76,52,2,0,Math.PI*2); c.fill();
            // beak (orange triangle)
            c.fillStyle="#FF8C00";
            c.beginPath(); c.moveTo(58,62); c.lineTo(70,62); c.lineTo(64,70); c.fill();
            // freckles (Felix signature)
            c.fillStyle="rgba(200,100,50,0.6)";
            c.beginPath(); c.arc(46,62,3,0,Math.PI*2); c.fill();
            c.beginPath(); c.arc(82,62,3,0,Math.PI*2); c.fill();
            c.beginPath(); c.arc(42,68,2,0,Math.PI*2); c.fill();
            c.beginPath(); c.arc(86,68,2,0,Math.PI*2); c.fill();
            // tiny feet

// Build SKZOO grid
const grid = document.getElementById('skzooGrid');
SKZOO.forEach((skz, i) => {
    const div = document.createElement('div');
    div.className = 'skzoo-item';
    const sv = document.createElementNS('http://www.w3.org/2000/svg','svg');
    sv.setAttribute('viewBox','0 0 128 128');
    const fo = document.createElementNS('http://www.w3.org/2000/svg','foreignObject');
    fo.setAttribute('width','128'); fo.setAttribute('height','128');
    div.innerHTML = `<canvas width="64" height="64" id="skz_${i}"></canvas><span>${skz.name}</span>`;
    div.onclick = () => loadSKZOO(i);
    grid.appendChild(div);
    // draw preview
    setTimeout(() => {
        const pc = document.getElementById(`skz_${i}`);
        const pctx = pc.getContext('2d');
        pctx.fillStyle = '#000';
        pctx.fillRect(0,0,64,64);
        pctx.save();
        pctx.scale(0.5, 0.5);
        skz.draw(pctx);
        pctx.restore();
    }, 100);
});

function loadSKZOO(i) {
    clearCanvas();
    SKZOO[i].draw(ctx);
    saveCanvas();
    status.innerText = `${SKZOO[i].name} (${SKZOO[i].member}) cargado ✓`;
}

// ===================== TABS =====================
function switchTab(tab) {
    document.querySelectorAll('.tab').forEach((t,i) => {
        const panels = ['text','skzoo','emoji'];
        t.classList.toggle('active', panels[i] === tab);
    });
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-'+tab).classList.add('active');
}

// ===================== DRAW TOOLS =====================
function setTool(tool) {
    currentTool = tool;
    document.getElementById('toolDraw').classList.toggle('active', tool==='draw');
    document.getElementById('toolErase').classList.toggle('active', tool==='erase');
}

function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (clientX - rect.left) * (128 / rect.width), y: (clientY - rect.top) * (128 / rect.height) };
}
canvas.addEventListener('pointerdown', (e) => { isDrawing = true; draw(e); });
window.addEventListener('pointerup', () => { if (isDrawing) { isDrawing = false; saveCanvas(); } });
canvas.addEventListener('pointermove', draw);

function draw(e) {
    if (!isDrawing) return;
    const pos = getPos(e);
    const size = parseInt(document.getElementById('brushSize').value);
    ctx.fillStyle = currentTool === 'erase' ? "black" : "white";
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, size, 0, Math.PI * 2);
    ctx.fill();
}

function clearCanvas() {
    ctx.fillStyle = "black"; ctx.fillRect(0, 0, 128, 128); saveCanvas();
    status.innerText = "Lienzo limpiado.";
}
function saveCanvas() { try { localStorage.setItem('last_oled_img', canvas.toDataURL()); } catch(e){} }

// ===================== TEXT =====================
function selectFont(btn) {
    document.querySelectorAll('.font-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedFont = btn.dataset.font;
}

function applyText() {
    const text = document.getElementById('textInput').value.trim();
    if (!text) { status.innerText = "⚠️ Escribe algo primero."; return; }
    const size = parseInt(document.getElementById('fontSize').value);
    ctx.fillStyle = "white";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = `bold ${size}px ${selectedFont}`;
    ctx.fillText(text, 64, 64);
    saveCanvas();
    status.innerText = `Texto aplicado ✓`;
}

// ===================== ICONS =====================
function loadIcon(emoji) {
    clearCanvas();
    ctx.fillStyle = "white"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "90px Arial";
    ctx.fillText(emoji, 64, 68);
    saveCanvas(); status.innerText = "Icono cargado ✓";
}

// ===================== BLUETOOTH =====================
function initBT() {
    status.innerText = "Conectando Nachimbong...";
    try {
        if (window.bridge) { window.bridge.blePairingStart(""); status.innerText = "Emparejando..."; }
        else if (window.webkit?.messageHandlers?.blePairingStart) { window.webkit.messageHandlers.blePairingStart.postMessage(""); status.innerText = "Emparejando (iOS)..."; }
        else { status.innerText = "Bridge no disponible (modo preview)."; }
    } catch(e) { status.innerText = "Error BT: " + e.message; }
}

function resetDevice() {
    status.innerText = "Reiniciando Nachimbong...";
    try {
        const resetCmd = "8110,-";
        if (window.bridge) {
            window.bridge.bleSendCmdList(resetCmd);
            setTimeout(() => { window.bridge.bleDisconnect(""); setTimeout(initBT, 2000); }, 500);
        } else if (window.webkit?.messageHandlers?.bleSendCmdList) {
            window.webkit.messageHandlers.bleSendCmdList.postMessage(resetCmd);
            setTimeout(() => { window.webkit.messageHandlers.bleDisconnect?.postMessage(""); setTimeout(initBT, 2000); }, 500);
        }
        status.innerText = "Reiniciando... reconectando en 2s";
    } catch(e) { status.innerText = "Error al reiniciar: " + e.message; }
}

async function transferOled() {
    status.innerText = "Preparando...";
    const imgData = ctx.getImageData(0, 0, 128, 128).data;
    let oledBytes = new Uint8Array(2048);
    for (let y = 0; y < 128; y++) {
        for (let x = 0; x < 128; x++) {
            const idx = (y * 128 + x) * 4;
            if (imgData[idx] > 128) {
                const byteIdx = (Math.floor(y / 8) * 128) + x;
                oledBytes[byteIdx] |= (1 << (y % 8));
            }
        }
    }
    for (let part = 0; part < 16; part++) {
        const chunk = oledBytes.slice(part * 128, (part + 1) * 128);
        const hexData = Array.from(chunk).map(b => b.toString(16).padStart(2, '0')).join('');
        const cmd = `810F00000000${part.toString(16).padStart(2, '0')}${hexData},-`;
        try {
            if (window.bridge) window.bridge.bleSendCmdList(cmd);
            else if (window.webkit?.messageHandlers?.bleSendCmdList) window.webkit.messageHandlers.bleSendCmdList.postMessage(cmd);
            status.innerText = `Enviando: ${Math.round(((part+1)/16)*100)}%`;
            await new Promise(r => setTimeout(r, 150));
        } catch(e) { status.innerText = "⚠️ Error en parte " + (part+1); return; }
    }
    status.innerText = "✅ ¡Enviado!";
}

window.onload = () => {
    ctx.fillStyle = "black"; ctx.fillRect(0,0,128,128);
    const last = localStorage.getItem('last_oled_img');
    if (last) { let im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0); im.src = last; }
    setTimeout(initBT, 1000);
};
