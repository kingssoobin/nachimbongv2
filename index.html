<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nachimbong OLED Studio: STRAY CITY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            background: #0a0a0a;
            color: #eee;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { color: #ed1c24; margin-bottom: 5px; font-size: 1.2rem; }
        p.subtitle { color: #888; font-size: 0.8rem; margin-bottom: 10px; }
        
        #canvas {
            border: 2px solid #ed1c24;
            background: #000;
            width: 240px;
            height: 240px;
            image-rendering: pixelated;
            touch-action: none;
            margin-bottom: 15px;
            border-radius: 5px;
        }

        .gallery-label { font-size: 0.7rem; color: #666; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 320px;
            margin-bottom: 20px;
            background: #111;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #333;
        }
        .gallery-item {
            aspect-ratio: 1;
            background: #000;
            border: 1px solid #444;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: 0.1s;
            color: white;
            font-weight: bold;
        }
        .gallery-item.special { border-color: #ed1c24; color: #ed1c24; font-size: 0.7rem; }
        .gallery-item:active { transform: scale(0.95); background: #222; }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            width: 100%;
            max-width: 300px;
        }
        button {
            width: 100%;
            padding: 14px;
            font-weight: bold;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
        }
        #sendBtn { background: #ed1c24; color: white; box-shadow: 0 4px 15px rgba(237, 28, 36, 0.3); }
        #clearBtn { background: #222; color: #aaa; border: 1px solid #444; }
        
        #status {
            color: #888;
            font-size: 0.8em;
            margin-top: 10px;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <h2>OLED Studio</h2>
    <p class="subtitle">Personalización Nachimbong V2</p>

    <canvas id="canvas" width="128" height="128"></canvas>

    <p class="gallery-label">Diseños Especiales:</p>
    <div class="gallery">
        <div class="gallery-item special" onclick="loadStrayCity()">CITY</div>
        <div class="gallery-item" onclick="loadIcon('❤️')">❤️</div>
        <div class="gallery-item" onclick="loadIcon('⭐')">⭐</div>
        <div class="gallery-item" onclick="loadIcon('⚡')">⚡</div>
        <div class="gallery-item" onclick="loadIcon('🔥')">🔥</div>
        <div class="gallery-item" onclick="loadIcon('👑')">👑</div>
        <div class="gallery-item" onclick="loadIcon('🐺')">🐺</div>
        <div class="gallery-item" onclick="loadIcon('✨')">✨</div>
    </div>

    <div class="controls">
        <button id="clearBtn" onclick="clearCanvas()">LIMPIAR LIENZO</button>
        <button id="sendBtn" onclick="transferOled()">ENVIAR A LA PANTALLA</button>
        <div id="status">Toca "CITY" para cargar tu diseño...</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const status = document.getElementById('status');
        let isDrawing = false; e;

        // --- CARGA DE TU DISEÑO "STRAY CITY" ---
        function loadStrayCity() {
            clearCanvas();
            const img = new Image();
            img.onload = function() {
                // Dibujamos la imagen centrada y escalada
                const scale = Math.min(128 / img.width, 128 / img.height);
                const x = (128 - img.width * scale) / 2;
                const y = (128 - img.height * scale) / 2;
                ctx.drawImage(img, x, y, img.width * scale, img.height * scale);
                saveCanvas();
                status.innerText = "¡STRAY CITY cargado!";
            };
            // Esta es tu imagen convertida a código para que no necesites subirla
            img.src = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAYAAADDPmHLAAAAAXNSR0IArs4c6QAAArVJREFUeF7t28tRBAEMRFFDCIzAKTAB52AM9pAExmAk7p2mO0A190vT2PZ6v6fX6XW6MvAnC/zJUve9DTAI/AmA78UAg0AnAL4XAwYBnQAAY0AHYADoAByAAaADcAAGgA7AAdABOAAH4ADcs8CO9/0+p/vT6f6NHz08p9OnY3AATidgB/D/CHAAfofYAbidp9N966fDAdidgB/A7Syd7ls/HQ7A7gT8AG5n6XTf+ulwAHYn4AdwO0un+9ZPhwOwOwE/gNtZOt23fjocgN0J+AHcztLpvvXT4QDsTsAP4HaWTvetnw4HYHcCfgC3s3S6b/10OAC7E/ADuJ2l033rp8MB2J2AH8DtLJ3uWz8dDsDuBPwAbmfpdN/66XAApwn8nZ/73tXp/nd6v73vunU4AAfg9MUC7Bv39v8I7ADuN7S96qfDATgAn4DtE7f9P2R2APdv2Hev+ulwAA7AJ2D7pG3/Z8vsAO7vsO9v/XQ4AAfgE7B98rb/59rsAO7f8PdWv344fToAn4BPAHw/BvA9O4D7DX1f9euH06cD8An4BMD3YwDfswO439D3Vb9+OH06AJ8ATAB8TwbwLTuA21m6Xz98On8F7ADuN7S96qfDAdidgB/A7Syd7ls/HQ7A7gT8AG5n6XTf+ulwAHYn4AdwO0un+9ZPhwOwOwE/gNtZOt23fjocgN0J+AHcztLpvvXT4QDsTsAP4HaWTvetnw4HYHcCfgC3s3S6b/10OAC7E/ADuJ2l033rp8MB2J2AH8DtLJ3uWz8dDsDuBPwAbmfpdN/66XAApwn8nd/73tXp/nd6v73vunU4AAfg9MUC7Bv39v+I4HSA6Q99v/9C9X9Yv347OYA/Cej76A96v6dfXb9vEOD7McAg0AmA78WAAXAAzoAOGADYnS/Tz+m+P50+XW6f/gAs76Y0B18X3QAAAABJRU5ErkJggg==";
        }

        // --- DIBUJO ---
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: (clientX - rect.left) * (128 / rect.width), y: (clientY - rect.top) * (128 / rect.height) };
        }
        canvas.addEventListener('pointerdown', (e) => { isDrawing = true; draw(e); });
        window.addEventListener('pointerup', () => { if (isDrawing) { isDrawing = false; saveCanvas(); } });
        canvas.addEventListener('pointermove', draw);

        function draw(e) {
            if (!isDrawing) return;
            ctx.fillStyle = "white";
            const pos = getPos(e);
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        function clearCanvas() { ctx.fillStyle = "black"; ctx.fillRect(0, 0, 128, 128); saveCanvas(); }
        function saveCanvas() { localStorage.setItem('last_oled_img', canvas.toDataURL()); }

        function loadIcon(emoji) {
            clearCanvas();
            ctx.fillStyle = "white";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.font = "90px Arial";
            ctx.fillText(emoji, 64, 68);
            saveCanvas();
            status.innerText = "Icono cargado.";
        }

        // --- ENVIO ---
        async function transferOled() {
            status.innerText = "Preparando datos...";
            const imgData = ctx.getImageData(0, 0, 128, 128).data;
            let oledBytes = new Uint8Array(2048);

            for (let y = 0; y < 128; y++) {
                for (let x = 0; x < 128; x++) {
                    const idx = (y * 128 + x) * 4;
                    if (imgData[idx] > 128) {
                        const byteIdx = (Math.floor(y / 8) * 128) + x;
                        oledBytes[byteIdx] |= (1 << (y % 8));
                    }
                }
            }

            for (let part = 0; part < 16; part++) {
                const chunk = oledBytes.slice(part * 128, (part + 1) * 128);
                const hexData = Array.from(chunk).map(b => b.toString(16).padStart(2, '0')).join('');
                const cmd = `810F00000000${part.toString(16).padStart(2, '0')}${hexData},-`;

                if (window.bridge) window.bridge.bleSendCmdList(cmd);
                else if (window.webkit?.messageHandlers?.bleSendCmdList) 
                    window.webkit.messageHandlers.bleSendCmdList.postMessage(cmd);

                status.innerText = `Enviando... ${Math.round(((part+1)/16)*100)}%`;
                await new Promise(r => setTimeout(r, 120));
            }

            status.innerText = "✅ ¡STRAY CITY enviado!";
            setTimeout(() => { if (window.bridge) window.bridge.bleDisconnect(""); }, 1000);
        }

        window.onload = () => {
            const last = localStorage.getItem('last_oled_img');
            if (last) { let im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0); im.src = last; }
            setTimeout(() => { try { window.bridge.blePairingStart(""); } catch(e){} }, 800);
        };
    </script>
</body>
</html>
